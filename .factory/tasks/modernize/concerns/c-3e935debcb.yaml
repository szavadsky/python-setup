id: c-3e935debcb
kind: risk
summary: PoC lock is POSIX-only fcntl.flock
detail: The prototype locks with `fcntl.flock` on a persistent lock file (safe
  against stale locks because the advisory lock, not file existence, is
  authoritative). Windows needs an msvcrt/portable-lock fallback, and flock
  semantics on NFS are unvalidated. The model matrix confirms win_amd64 CPU
  wheels exist, so Windows is a supported consumer platform.
