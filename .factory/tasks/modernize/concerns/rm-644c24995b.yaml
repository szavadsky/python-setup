id: rm-644c24995b
chosen: Age pruning is opt-in (`--max-age-days`), disabled by default
alternatives:
  - Fixed 90/180/365-day default TTL
  - Prune on every lint run (violates read-only lint)
  - No age mechanism at all (loses the ability to expire abandoned entries on
    demand)
why: No ADR defines a TTL, and a default would silently discard still-valid
  decisions in rarely refreshed projects. Empty-file, missing-file, stale-model
  and stale-prompt pruning already bound growth; the optional mechanism is
  proven with a 30-day horizon.
