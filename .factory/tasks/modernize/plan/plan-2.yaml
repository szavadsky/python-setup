        _CANARY_LABEL, _FIX_TOOL_NAMES+assert. Consumers:
        integration->{copy,git_init_and_stage,make_runner_config,build_overlay,\
        ensure_precommit,install_twice}; conftest->{shipped_config_paths};
        _autofix->{git_init_bare,write_project_file,stage_file,commit_all}. Test
