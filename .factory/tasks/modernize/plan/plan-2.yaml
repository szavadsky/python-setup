milestones:
  - directionalInterfaces:
      - "_RuffFormatLintTool(LintTool) in runner/dispatch.py:
        build_command(config,_path,_exclude)->['ruff','format','--check','--con\
        fig',<ruff.toml>,...paths] (check mode, default);
        build_format_command(config,_path,_exclude)->['ruff','format','--config\
        ',<ruff.toml>,...paths] (mutating). cli.py phase-1a calls
        build_format_command (fix-only), normal pass calls build_command.
        runner/_config.py maps 'ruff format'->ruff.toml; _config_flag_for
        handles it. No if-spec.name in _build_command."
      - "Registry invariants owned by runner/dispatch.py, re-exported via
        runner/__init__.py: EXPECTED_TOOL_NAMES (14); FORMATTER_ONLY={'ruff
        format'} (statistics-exempt); STATISTICS_PARSER_TOOLS (13);
        RECORD_PARSER_TOOLS (9); RECORDLESS_TOOLS={tach
        check,mypy.stubtest,pyright verify types,detect-secrets,ruff format}
        intentional. Tests import from python_setup_lint.runner. Migration:
        test_lint_runner set+count 13->14; _factories_extras 13->14; stats + t3
        assert STATISTICS set; fakes invariants assert EXPECTED set."
      - "Docs contract: every 13-site -> 14 by grep enumeration
        (AGENTS.md:9,43,63,92,93 + counts :10-11; README.md:58;
        docs/overlays.md:3; docs/tutorials.md:26; runner/__init__.py:3;
        cli.py:314; any factory/docstring hit). tool_counts.json asserted 14
        keys incl 'ruff format':0 (already true; verify, not rewrite)."
    id: M1
    scenarios:
      - >-
        Scenario: Gates green per-gate
          Given clean HEAD with empty lint.baseline
          When format gate exits 0 (173 files formatted), lint gate exits 0 (SIM102+R0914+C0208 fixed, secrets clean or operator-excluded with evidence), `pytest -q` exits 0 (6 fixed, no new failures), integration exits 0
          Then all gates pass and lint.baseline stays []
      - >-
        Scenario: Lint check-only without --fix
          Given a clean worktree
          When `uv run lint` runs without --fix
          Then `git status --porcelain` is empty; a command spy shows the normal-pass ruff-format cmd contains --check and --config config/ruff.toml, and the mutating format cmd (phase-1a) runs only under --fix without --check
      - >-
        Scenario: Registry single-sourced
          Given the TOOLS table
          When tests and docs read the tool count
          Then every assertion reads 14 from EXPECTED_TOOL_NAMES with FORMATTER_ONLY/RECORDLESS exemptions explicit and no hardcoded 13 remains
