    resolution: "Resolved by runner-format-contract: _RuffFormatLintTool with check
      vs format modes, phase-1a mutates (fix-only), normal pass checks with
      shipped config."
  - category: blocking
    description: "Red baseline: 6 tests assert 13 vs 14 tools; SIM102
      stub/coverage.py:196; R0914 cli.py:50 (23/20); C0208
      _factories_extras.py:383 set-iteration; factory-journal detect-secrets
      flag. Empty baseline masks real violations."
    id: TD2-B2
    resolution: Resolved by runner-format-contract (14-tool migration + docs
