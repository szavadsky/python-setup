  - directionalInterfaces:
      - "Eval contract: DecisionBackend Protocol
        decide(justification,rule,context)->float in [0,1]; bars >=90% acc /
        >=95% meaningless-precision / >=85% meaningful-recall; corpus =
        threshold 30+50 + brush-off/meaningful tables + N real repo suppressions
