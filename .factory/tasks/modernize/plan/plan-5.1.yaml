adrs:
  - id: ADR-019
    title: Tracked-cache keying, scored read path, and refresh contract (I5)
    context: ADR-010 freezes backend + tracked-cache contracts but leaves
      file-identity vs path-free API, key composition, score vs verdict, refresh
      shape, CI direction, isolation scope, sort key, prune policy, --path
      scoping, jobs>1 behavior unspecified (I5 pack Q3). semantic_check is
      deliberately path-free and memo-only (_semantic.py:28-65, bool|None hides
      float); callers pass no paths; no CLI surface; secrets baseline enables
      HexHighEntropyString while justifications are verbatim user content;
      writer-first verdict pins jobs=1 sequential; root tach.toml and
      config/tach.toml both list checkers/runner only; RunnerConfig has no
      refresh fields (types.py:48-60). I4 ADR-017/018 planned lint-flag refresh
      + decisions-module placement but never merged. I4 left a prune-only
      producer gap (awareness).
    decision: "Re-affirm ADR-017/018 shape with I5 resolutions: (1) _semantic gains
      semantic_score()->float|None (+.pyi, clamped [0,1]) + file-backed read
      branch; memo value becomes (score, decision) tuple (applied onto M2 dict
      shape via dep; _base/_decision_backend bodies zero diff); semantic_check
      thresholds the score (existing bool|None contract preserved). (2)
      semantic_check stays path-free re callers; file identity supplied at
      checker layer via refresh-only sidecar producer (suppression/bare-except
      emit when OBSERVE=1: {file via node.root().file, justification, rule,
      model, score via semantic_score memo reuse — single backend call, no
      heuristic duplication} to OBSERVE_PATH tmp *.jsonl, never committed; unset
      emits nothing). (3) Tracked key (justification normalized, rule joined
      codes, model '<id> rev <short12> prompt-vN'); context model-input-only.
      Store score + decision (re-thresholdable). Hit/miss/absent: rejected→False
      no read/backend; file-missing→None→heuristic True; entry-hit→persisted
      decision with backend-uncalled proof; key-miss→one backend call, memo
      only. (4) Refresh lint --refresh-decisions [--path ...] (setup-subcommand
      rejected); FAILS under CI/GITHUB_ACTIONS; DECISIONS_PATH test-only under
      PYTEST_CURRENT_TEST; production root config.cwd + traversal guard; sorted
      (rule, justification, model) indent=2 sort_keys; files union-merged POSIX;
      prune = scanned-scope-only missing removal + stale-model (model != refresh
      folded id) whole-entry drop + file-removal/drop-empty-entry (no --prune
      flag); --path retains unscanned; jobs_from_rcfile() over resolved pylint
      rcfiles, any >1 fails loudly naming file. (5) Placement decisions/ module;
      BOTH root tach.toml AND config/tach.toml gain [[modules]] decisions
      depends_on=[] + checkers/runner depends_on=[python_setup_lint.decisions];
      cache-impl sole owner of both. (6) last-seen ISO date updated ONLY on
      score/decision/files change (byte-identical double-run holds). (7)
      Read-only = SHA-256 file-bytes hash (missing=sentinel) unchanged across
      ordinary run_lint. (8) Secrets: schema fields hex-free by construction
      (rev 12, prompt hash hexdigest[:12]); verbatim justification/rule MAY
      contain hex → refresh structlog-warns + docs risk-accept (same as source
      comments). RunnerConfig gains refresh_decisions: bool=False. No .gitignore
      change, no hatch entry."
    consequences: Single contract for M1 format assumptions + M3 behavioral impl;
      storage + scored read + producer atomic in one item
      (checker->sidecar->cache proven on tmp, no prune-only gap, no bool-hiding
      drift); normal lint read-only provable by hash; deterministic
      serialization provable; secrets + tach (both files) scans clean; M3 tests
      assert hit/miss/absent + prune granularity + jobs guard on tmp.
  - id: ADR-020
    title: Model gating and default-off wiring for I5
    context: Intent names GLiDE-0.4B or smaller; GLiDE is 0.4B/0.81GB
      bf16/CUDA-tested/torch 2.14/transformers 5.17/glide-vendored/Fastino
      Community License (commercial revenue gate + attribution + copyleft
      derivatives) vs MIT project; smallest-in-family so 'or smaller' needs a
      different family; ADR-009 corpus gate untouched (215/0 single-author, no
      corpus artifacts, no CPU bench); get_backend has no production path and
      news instances per call (_decision_backend.py:37-59); veto semantics mean
      default-on tightens W9704/W9738 for every consumer installing the extra;
      loader APIs differ per runtime family; uv.lock regen needs network.
    decision: "Gate wiring on U1 verdict with allowlist (Apache-2.0/MIT/BSD allowed;
      CC-BY-NC excluded; Fastino/unclear flagged) + CPU bench (cold-load/warm
      p50/p95 + RSS, GLIDE_MAX_BATCH=1 determinism) + corpus pilot (JSON-schema
      handoff, re-validated) + RECORDED HUMAN APPROVALS via needs_human->steer
      workflow (spikes emit needs_human report fields — never write steer
      records; engine converts; wiring reads Task Status steer answers at
      execution and cites IDs; absent/negative forces default NO-GO with no
      pause). PROD_MODEL_ID_RE + FAKE_ALLOWLIST + DECISION_MODEL_RE + malformed
      table per M1. Veto-only evaluation at 0.5/0.6/0.7; bars 90/95/85 on
      accepted stratum; smallest compliant or no-go. Wiring (on go + approvals
      only): per-family loader (transformers ~60 | vendored-glide ~100 | other
      <=120 lines), PROMPT_VERSION folded, failure→None→heuristic exactly-one
      warning (no retry storm), [semantic] pinned runtime only (CPU wheels, base
      stays light), allowlist pins (chosen top-level present,
      sentence-transformers absent, no unpinned git/URL deps, base dep set
      unchanged), no_try_import updated deliberately, single networked `uv lock`
      + `uv sync --frozen` offline verify. Default heuristic-only until M4 go
      merges; semantic-on pinned regardless. On no-go/blocked/missing-approval:
      zero prod writes, no-op attestation, heuristic-only docs."
    consequences: No silent swap, no self-approved license/corpus gate, no
      unbudgeted loader work; gates stay offline/fast/deterministic except one
      documented lock step; close-up must not claim swap complete on no-go; I6
      triggers explicit.
  - id: ADR-021
    title: Semantic-on behavior pinning
    context: Golden + integration capture with SEMANTIC=0, so model-enabled
      W9704/W9738 outcomes unpinned; veto extremes deterministic without
      network; but _walk_and_release takes no backend, checkers pass no backend,
      get_backend() news instances per call, and pylint subprocess cwd lacks
      tests on PYTHONPATH — parent call-counts unobservable across run_lint and
      child dotted imports unprovable.
    decision: "Pin veto path in two layers with no unobservable asserts: (1) COUNTS
      via direct semantic_check_if_meaningful/semantic_score calls with
      backend=_RecordingBackend kwarg (public .pyi API, same process): 1.0
      preserves, 0.0 vetoes, brush-off count 0, one call per unique pair
      (memo-tuple hit). (2) VERDICTS via walks (default None->heuristic,
      verdicts only) + subprocess sample-project run asserting verdict deltas
      via tmp cache-hit only (persisted False flips W9704 on, no model load, no
      PYTEST_CURRENT_TEST leakage); dotted-path import in child FORBIDDEN. Plus
      exactly one slow+with_real_api e2e SKELETON (skipped 'no model wired'
      until go; on go wired with importorskip + CPU budgets). Golden stays
      SEMANTIC=0 (heuristic contract); semantic-on contract lives in new tests."
    consequences: Veto tightening visible before any model ships with only
      observable asserts; no PYTHONPATH proof burden; no golden churn for
      semantic-on; real-model coverage gated behind slow + importorskip; M4
      wiring asserts no SEMANTIC=0 drift.
  - id: ADR-022
    title: Test-harness single-sourcing and debloat acceptance
    context: Measured duplication at HEAD (13 _make_tc, 10 _walk_and_release with
      open()/source_roots/module_name variance incl structlog source_roots
      pattern, 8 _msg_ids as 7 set + 1 sorted-list, 3 _RecordingBackend, 2
      _UvCallRecorder, 2 extra_block, 2 _semantic_disabled, dead helpers incl
      possibly-live sample_project fixture, vestigial raising=False cache tests,
      smoke overlapping integration + fake orchestration) vs behavior contracts
      (115-row heuristic table, W9704/W9738 checker tests, golden 158).
      testing.pyi must mirror testing.py or stubtest fails. 'Never test linting'
      defined only by 644774e precedent. No line-reduction metric beyond
      C0302/R0912/R0915 + empty baseline.
    decision: "Single-source with full signatures: _walk_and_release(...,
      open_checker=False, source_roots=None) with open semantics
      (config.source_roots = source_roots or ['src']; checker.open() before
      walk) + module_name passthrough; _msg_ids()->set +
      _msg_ids_sorted()->list; testing.pyi synced atomically; per-file migration
      table in report. Cmd_build gains _resolve_tool_rcfile(tool_key,
      config_paths, cwd, shipped) with byte-identical built-command proof
      (pylint migrates iff identical, else stays noted). Delete dead helpers
      only with per-helper grep-zero proof incl fixture-arg injection search
      (keep + document survivors). Rewrite (not loosen) vestigial cache tests to
      live hash/tmp contracts; smoke kept-narrowed (per-assert survivor
      analysis) or deleted with removal-to-survivor map; 115-row table + checker
      behavior + golden preserved byte-identical; touched modules <=500, no new
      suppressions. Acceptance is grep-zero/proof + no-new-failures + golden
      hash-equal, not line-count delta."
    consequences: Debloat without intent loss or behavior change; no
      gate-duplicating tests reintroduced; future harness changes have single
      homes; QA verifies by grep + gates + stubtest, not LOC.
  - id: ADR-023
    title: Root-serialized delivery continued for I5
    context: I3 epic gate stalled (retry + 3 empty waves, Blocked none, M2 zero
      delivery per closeup-3); I4 ADR-013 abandoned epics for root items with
      file-level single-writer + dep serialization, unblocking M2 verified +
      M3/M4 partials; I4 closeup shows 2 running + 3 pending carried by file
      ownership; review requires file-level proof, consumed (not advisory) spike
      verdicts, and joint ownership (M2 memo shape -> M3 memo tuple/read API)
      via deps.
    decision: I5 ships no child epics; all work as 18 root items with file-level
      single-writer for parallel items plus dep serialization for handoffs
      (harness-dedup into semantic-doubles; matrix+corpus into eval into
      runtime-pinning; cache-contracts + source-simplifications into cache-impl
      into golden-pin into backend-wiring; loader-contracts into backend-wiring;
      pyi-spike + source-simplifications into pyi-fix; all behavior + debloat
      into docs; all behavior into hatch into gate table). No replanAfter gates;
      spike verdicts consumed via deps with pre-planned go/no-go and fix/orphan
      branches (no-op attestations on blocked, never invented alternatives). I6
      may reintroduce epics or continue root increments.
    consequences: 8 dep-free wave-1 items avoid empty waves (eval + runtime-pinning
      + cache-impl + downstream dep-gated); no epic close-up/handoff bottleneck;
      M5 hatch consumes item shift declarations directly; parallel same-file
      forbidden, sequential same-file only via explicit deps; every assumption
      file has a consumer dep.
  - id: ADR-024
    title: Pylint-pyi scope resolution process
    context: ADR-015 defers fix to I5; _PylintPyiLintTool passes .pyi paths but
      pylint lints companion .py (42/43 golden on .py per old probe); 205 latent
      private stub symbols; temp-tree rewrites src/... paths needing golden-key
      mapping; fixing changes golden + exposes cleanup (incl possible
      stubtest-required .py co-changes), conflicting with preservation unless
      staged via hatch; strategy fix vs scope note unknown at plan time;
      orphan-only leaves companion stubs style-unenforced (stubtest!=style,
      operator-aware).
    decision: "Resolve by spike then branch: M1 pyi-scope-spike reproduces
      companion-vs-orphan on tmp + pocs ONE mechanism (temp-tree/copy or
      no-companion mode) with broken-stub control + tmp-to-repo path-mapping
      table + recounts golden impact + latent budget at HEAD + recommends
      fix-with-regen (proven mechanism + mapping + cleanup budget + regen plan)
      vs orphan-only (scope-note text). M5 pyi-scope-fix consumes verdict (never
      invents alternative): FIX implements spike-proven mechanism with mapping
      applied before golden keys + shift report + stub cleanup (owns
      src/**/*.pyi + stubtest-required .py, enumerated; <=200 prod lines
      in-budget or I6 file-list routing, never baseline edits), golden via hatch
      only; ORPHAN-ONLY merges zero prod diff with scope-note text for docs.
      Branch-distinct docs strings grepped per verdict. 'Coding rules enforced'
      states the verified truth either way."
    consequences: Golden stable unless fix merges via hatch; mechanism proven before
      commit; mapping keeps keys repo-relative; latent cleanup budgeted
      explicitly; I6 follow-ups concrete if over-budget; docs state scope
      truthfully.
