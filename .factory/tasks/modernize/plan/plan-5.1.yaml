milestones:
  - id: M1
    title: Test infrastructure and decision contracts first
    directionalInterfaces:
      - "Cache file contracts (NEW
        tests/assumptions/test_decision_cache_contracts.py, no_external_api,
        passable at M1 via inline tmp JSON without prod imports): round-trip
        sorted (rule, justification, model) indent=2/sort_keys deterministic
        (double-write byte-identical), last-seen update-only-on-change rule;
        secrets split — schema-controlled fields never emit hex>=20 (rev short12
        = 12 chars, prompt hash = sha256 hexdigest[:12], version/paths clean;
        unit test with adversarial SHA-bearing justification proves only the
        verbatim field contains it), tmp check shells the installed hook
        (`detect-secrets-hook --baseline <fresh-tmp-baseline> <tmp-cache>`; item
        cites --help at HEAD + exact invocation) asserting zero findings on
        representative entries. DEFERRED to M3 impl tests: read-only hash,
        refresh CI-guard, prune, --path, jobs>1."
      - "Loader delta contracts (NEW
        tests/assumptions/test_decision_loader_contracts.py, no_external_api; do
        NOT re-pin honors/ignores/warn-once at
        tests/checkers/test_decision_backend.py:117-165 — cite, never
        duplicate): PROD_MODEL_ID_RE `^[\\w.\\-/]+ rev [0-9a-f]{12}
        prompt-v\\d+$` + FAKE_ALLOWLIST {'fake-backend rev test
        prompt-v1','dotted-loader rev test prompt-v1'} (strict regex would
        reject 'test'; allowlist is explicit, never widened silently);
        DECISION_MODEL_RE `^(?P<id>[\\w.\\-/]+) rev (?P<rev>[0-9a-f]{12})$`;
        malformed (missing rev, rev len!=12, non-hex rev, trailing ' prompt-vN',
        empty/whitespace, extra tokens) maps to None + exactly-one warning;
        failure-to-None maps to heuristic bool (no raise, no retry). Consumed by
        model-backend-wiring via dep."
      - "Model spikes (report-only, zero committed files): candidate matrix
        {license, params/size, runtime, py3.14 CPU wheels linux/mac/win,
        custom-code/vendoring, pinnable revision, offline}; corpus pilot {JSON
        code-block schema [{id, justification, rule, context, stratum, label,
        source, pass1, pass2, adjudicated}] + counts {total, post_dedup>=100,
        per_stratum non-empty, per_source} + agreement, N>=100 post-dedup,
        rubric} or explicit blocker; CPU eval {veto-only 0.5/0.6/0.7, 90/95/85
        on accepted stratum, latency pilot on 12-item subset then full accuracy
        on non-excluded, per-candidate 30-min timeout with explicit exclusion +
        partial results, cold-load/warm p50/p95 + RSS, GLIDE_MAX_BATCH=1
        determinism, re-validates corpus (re-normalize + re-dedup, counts match,
        strata non-empty), smallest compliant or no-go, needs_human fields on
        Fastino/unclear + second-rater flag}; runtime pinning (conditional on
        go, else report-only skip)."
      - "Pyi spike (report-only, tmp poc incl mechanism): {reproduction
        companion-vs-orphan, mechanism poc (temp-tree/copy OR pylint
        no-companion mode on tmp: broken-stub control proves
        skipped-before/linted-after + tmp-to-repo path-mapping table for golden
        keys), golden counts recount at HEAD, latent budget recount (symbols +
        duplicate-code), recommendation fix-with-regen (mechanism + mapping +
        cleanup budget + regen plan) vs orphan-only (scope-note text)}."
