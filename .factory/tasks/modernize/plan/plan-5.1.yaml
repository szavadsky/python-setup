  - slug: brush-off-corpus-pilot
    kind: fact-finder
    title: Build two-pass brush-off pilot sample
    description: "Report-only, zero repo writes (no committed corpus in I5; poc
      consumes report tables via schema). Collect N real repo suppressions +
      threshold 115-row table + brush-off/meaningful tables, DEDUPED by
      normalized justification (strip+collapse ws, keep case; target N>=100
      post-dedup), stratified heuristic-rejected vs heuristic-accepted (both
      non-empty). Rubric: specific technical justification vs
      placeholder/deferral/brush-off (disclose edge-case rubric for terse
      borderlines). Rater protocol: pass-1 rates all; pass-2 re-rates blinded
      (shuffled, pass-1 hidden); disagreements resolved by documented
      adjudication rule (disclose rule). HANDOFF: ```json corpus.json code block
      [{id, justification, rule, context, stratum: rejected|accepted, label:
      true|false, source: repo|threshold|table, pass1, pass2, adjudicated}] +
      counts {total, post_dedup, per_stratum, per_source} + agreement.
      Single-author bias NOT fully repaired — human second rater still required
      before any go/no-go (needs_human field). Or explicit blocker
      (collection/license/CPU) with I6 plan. No model choice here."
    milestoneId: M1
    deps: []
    escalate: true
    prodBudgetHint: 0
  - slug: model-eval-poc
    kind: poc
    title: CPU accuracy/latency evaluation (veto-only)
    description: "Prototype on tmp/venv only; zero committed files; network inside
      spike only. Consumes matrix + corpus reports (never invents
      candidates/labels). FIRST re-validate corpus: parse JSON handoff,
      re-normalize + re-dedup, assert counts match ±0 and both strata non-empty
      (fail loudly on mismatch, do not silently resample). Mapping:
      justification=primary, rule=joined codes (current symbol where
      unavailable, recorded), context=code_context (None allowed);
      decision=prob>=threshold; VETO-ONLY final=heuristic AND (prob>=threshold)
      per ADR-014 (replace mode rejected — do not score). Smallest=lexicographic
      (params, weights bytes, CPU RSS, p50 latency). PROTOCOL: latency pilot on
      12-item subset per candidate first (cold-load + warm p50 + RSS), then full
      3-threshold accuracy on non-excluded candidates; per-candidate 30-min wall
      timeout → explicit exclusion with partial results + reason (never silent
      drop). Metrics: accuracy, meaningless-precision, meaningful-recall on
      heuristic-accepted stratum (overall also reported), determinism check
      (GLIDE_MAX_BATCH=1 when caching; batching must not shift scores). Bars
      90/95/85 apply to accepted stratum. Recommend smallest compliant
      model+prompt+threshold or no-go with evidence (license/CPU/accuracy
      blockers separated). Emit needs_human fields (Fastino/unclear
      recommendation; second-rater requirement) — engine converts to steer;
      never write steer records directly. Feeds runtime-pinning + M4 branch."
    milestoneId: M1
    deps:
      - model-candidate-matrix
      - brush-off-corpus-pilot
    escalate: true
    prodBudgetHint: 0
