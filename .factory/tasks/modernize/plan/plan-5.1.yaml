        Scenario: Cache and loader contracts pinned before implementation
          Given HEAD with in-process memo only and no tracked cache
          When cache/loader assumption items merge
          Then new assumption modules pass offline, assert live or inline-format contracts only (no raising=False vestiges, no future-behavior pins), and M3/M4 consume them via deps (cache-impl->cache-contracts, backend-wiring->loader-contracts) without loosening; refresh/prune/jobs/read-only pinned in M3 tests, not M1
