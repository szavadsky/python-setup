debt:
  - Suppression/bare-except checkers pass their own symbol as `rule`; the
    rule-echo heuristic and model never see the actually-suppressed codes.
  - Semantic tests patch module globals and builtins.__import__, import privates
    under type:ignore; several assertions vacuous (`is None or ...`).
  - tests/integration.py 627 lines + too-many-lines suppression; duplicates
    conftest/_autofix helpers; substring-only assertions miss drift.
  - test_semantic_check.py 506 lines + suppression; heuristic tables duplicate
    test_semantic_threshold.py.
  - ~15 checkers repeat structural suppressions (missing-beartype on register(),
    type:ignore[misc] on mixin classes) + copied stream read/decode.
  - "Legacy/compat: baseline._FALLBACK_TOOLS/peek_fallback_tools,
    _compare_sorted re-export, astroid 3.x docstring fallback despite
    astroid>=4.0.4."
  - "dispatch.py 500+ char rationale comment ending in `# pylint:
    disable=unjustified-suppression` suppresses the justification checker
    itself."
  - tests/checkers/_factories.py ~1400 lines; ~40 pytest.param tables typed
    list[Any] with pasted justifications; cases far from tests.
  - Task-ID test names (test_t5_*, test_t9_7_*, test_t11_*, test_t1b_*,
    test_t3_*); repo-self-lint tests (test_self_lint_clean.py,
    AST/source-scanning guards, config re-checks) duplicate the `uv run lint`
    gate.
  - "ADR locations disagree: CodingRules requires design/, factory ADRs go to
    docs/adr."
  - Shipped rumdl.toml excludes tests/data, forcing the integration per-run
    rewrite to lint the sample AGENTS.md; affects golden determinism.
  - "RED-TEST WAIVED (gate inapplicable by design): golden-snapshot-wiring is a
    tests-only M1 contract item — probe verdict was test-side normalization
    sufficient, so the bounded src allowance was correctly NOT used and the diff
    touches only tests/_golden.py (+collect_findings), tests/integration.py
    wiring, and the two committed golden JSON files. Red-test (test must fail
    without src changes) cannot hold when zero src changes are the correct
    outcome. Compensating verification already in the item: drift injection on
    in-memory list copies proves assert_matches_golden detects add/drop drift;
    PYTHON_SETUP_LINT_UPDATE_GOLDEN=1 regen-twice byte-identical proves
    determinism; oracle + per-tool coverage + tool-qualified brush-off/carry
    lookups prove sensitivity. QA rejected 2/2 solely on red-test; all other
    checks passed. No src follow-up required."
  - "[golden-determinism-probe] Assert rumdl override fired instead of blind
    string replace"
  - "[golden-determinism-probe] Resolve symlinks and define outside-cwd
    relativize policy"
  - "[golden-determinism-probe] R0801 rule string embeds file spans, bypasses
