kind: saga
rationale: "The intent is a system-wide modernization spanning at least three
  independent, multi-wave workstreams: (1) repo-wide enforcement of
  CodingRules.md/AGENTS.md across ~28.6k lines of Python and stubs, (2)
  debloating code and removing redundant tests while preserving test intent, and
  (3) an architecture migration replacing the sentence-transformers
  cross-encoder reranker with a CPU-friendly small decision model plus a
  git-stored, cleaned-up cache. Each workstream crosses module boundaries,
  changes public/config surface (optional dependency, env vars, `_semantic.pyi`,
  docs), and carries design tradeoffs (model selection, threshold semantics,
  cache location/format/eviction, coverage retention). This exceeds a single
  coherent story and requires decomposition into progressive epics, likely with
  an initial model-evaluation spike."
