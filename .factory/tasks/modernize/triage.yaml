size: ~28.6k LOC across 184 .py/.pyi files (src ~11.4k, tests ~17.2k), 54 test
  modules and 739 test functions; semantic subsystem is 189 LOC plus a 506-line
  test module and 135-line threshold test; repo-wide 13-tool lint pipeline
risks:
  - Replacing the cross-encoder changes justification scoring behavior and the
    0.5 accept threshold; existing persisted result caches and test expectations
    may silently diverge.
  - A GLiDE-0.4B-class decision model likely adds a new runtime dependency
    (transformers/torch or ONNX) and CPU latency/memory/install-size costs; the
    current optional extra only installs sentence-transformers.
  - The requested 'git-stored cache' conflicts with the current home-directory,
    .gitignored cache design; it raises repo-size, determinism, merge-conflict,
    privacy, concurrent-write, and eviction/cleanup concerns.
  - Repo-wide debloating and test removal can drop regression coverage; the
    baseline is empty and the pre-commit/self-lint + integration gates are the
    only safety net.
  - Public surface changes must keep `_semantic.pyi`, `__all__`,
    `PYTHON_SETUP_LINT_SEMANTIC`, `PYTHON_SETUP_LINT_RERANKER_MODEL`, docs, and
    AGENTS.md references consistent.
  - Python >=3.14 syntax (for example unparenthesized except tuples) and
    .pyi/stubtest fidelity constrain mechanical refactors and tool autofixes.
  - Enforcing coding rules across the whole repo will produce a large diff; lint
    behavior must remain materially unchanged while lint.baseline stays
    effectively clean.
