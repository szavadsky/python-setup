title: Single-source helpers; integration.py under 500 lines
assignment: "GOAL: Single-source test project helpers and bring integration.py
  to 500 lines or less. SCOPE: tests only. FORBIDDEN: lint.baseline, AGENTS.md,
  docs, src. Red-test-exempt. STEPS: Create tests/_project_helpers.py as sole
  site with 11 pinned helpers: copy_sample_project(dest_parent: Path) to Path
  with mkdir parents plus copytree tests/data/minimal_sample_project to
  dest_parent/project (ex _copy_sample), git_init_and_stage(project) to None
  with test/test@test plus add dot (ex _init_git), shipped_config_paths to dict
  (ex _shipped_config_paths), make_runner_config(project) to RunnerConfig with
  minimal_sample plus rumdl override idempotent no-op if shipped rumdl missing
  (ex _make_config), git_init_bare(cwd) to None with Test/test@example.com -q no
  add (ex _git_init), write_project_file(cwd,rel,content) to Path (ex
  _write_file), stage_file(cwd,rel) to None (ex _stage), commit_all(cwd,msg
  init) to None (ex _commit_all),
  build_pylint_overlay_config(project,disable_rule) to Path extracting overlay
  217-240, ensure_precommit_or_skip to None,
  install_twice_assert_idempotent(project,monkeypatch) to None. STAY in
  _autofix_helpers.py untouched: _make_canned_fix_results, _PostFixFakeRunCmd,
  _CANARY_LABEL, _FIX_TOOL_NAMES plus assert. Delete shipped_config_paths def
  entirely from tests/conftest.py with no re-export; rewrite
  test_pyright_noise_filter.py:15 and test_self_lint_clean.py:15 to from
  tests._project_helpers import ...; integration.py consumes make_runner_config
  plus mapped subset only. Cycle guard: _project_helpers imports stdlib plus
  python_setup_lint.runner/setup/testing only, never tests.conftest or
  tests.integration. Keep test class and function names unchanged; helper
  renames per matrix only. Budget: remove at least 161 lines (661 to 500 or
  less): helpers 57 plus overlay 28 plus setup/idempotent 32 plus precommit 30
  plus loop/lookup 5 plus slicer 3 plus import/trim 8 equals 163. Remove :12
  too-many-lines via extraction; delete :202 stale too-many-locals disable
  directly (globally disabled in config/.pylintrc-tests:39; verify pylint tests
  plus W9704 clean). VERIFY: diff stat shows tests only, golden diff empty,
  pytest tests/integration.py -v passes, test_golden passes, touched files
  format-clean."
