assignment: "Create tests/_golden.py as SOLE golden owner (no pipeline run in
  this item). Implement: UPDATE_ENV='PYTHON_SETUP_LINT_UPDATE_GOLDEN',
  SEMANTIC_ENV='PYTHON_SETUP_LINT_SEMANTIC'; Finding TypedDict {tool:str,
  file:str|None, line:int|None, col:int|None, rule:str}; finding_key(f)
  None-safe (tool, file or '', line if int else -1, col if int else -1, rule)
  mirroring _violation_sort_key; normalize_record (drop msg, relativize vs
  project, strip './', backslash->'/', as_posix, assert non-absolute); serialize
