  assert_matches_golden (Counter multiset diff, sorted added/removed; UPDATE=1:
  pytest.fail('refusing to rewrite golden under CI...') if CI/GITHUB_ACTIONS
  else warn+rewrite golden+counts together); read_oracle_rules,
  slice_tool_section, assert_oracle_coverage, assert_tool_coverage. Consume
  golden-determinism-probe report normalization spec. Add tests/test_golden.py
  with synthetic Finding lists ONLY (no run_lint, no pipeline): finding_key None
  vs str/int ordering, POSIX normalization, multiset diff exact added/removed,
  CI-guard fail, coverage asserts, serialization byte-format. Constraints: no
  src/ changes, no golden files yet, module <=500 lines, formatted. Acceptance:
  `uv run pytest tests/test_golden.py -q` passes."
