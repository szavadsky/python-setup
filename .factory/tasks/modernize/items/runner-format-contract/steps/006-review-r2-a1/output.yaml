    summary: AGENTS.md Tool Scope table still lists 13 tools, omits ruff format
    detail: AGENTS.md Quick Commands now says 14 tools, but the Tool Scope table
      still has 13 rows and no ruff format entry. Add a row such as `| ruff
      format | src/, tests/ |` to keep the agent-facing table in lockstep with
      the 14-tool registry. The assignment's per-hit list did not name this
      table; non-blocking docs completeness.
    location:
      file: AGENTS.md
      line: 21
  - id: overlays-doc-lacks-ruff-format-mechanism
