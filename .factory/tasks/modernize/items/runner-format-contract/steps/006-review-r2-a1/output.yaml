suggestions:
  - id: ruff-format-config-override-gap
    disposition: optional
    summary: Consumer ruff config overrides do not reach ruff format
    detail: _RuffFormatLintTool._build reads config_paths["ruff format"] then falls
      back to _default_config_paths; it never consults the "ruff check" entry
      that _apply_config_overrides composes from [tool.ruff] / --config
      ruff=.... Consumer ruff overlays therefore apply to ruff check but not
      ruff format, so line-length/format settings can diverge. The
      shipped-config contract and the assignment's --check/--config spy are
      satisfied; non-blocking. Suggest falling back to config_paths.get("ruff
      check") or documenting the intentional split.
    location:
      file: src/python_setup_lint/runner/dispatch.py
      line: 412
  - id: agents-tool-scope-table-missing-ruff-format
