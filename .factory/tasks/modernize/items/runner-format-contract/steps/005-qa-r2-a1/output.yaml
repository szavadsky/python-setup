  - id: ruff-format-ignores-ruff-config-override
    disposition: optional
    summary: "`--config ruff=...` applies to ruff check but not ruff format"
    detail: "`_RuffFormatLintTool._build` reads `config_paths['ruff format']` then
      falls back to the shipped `_default_config_paths`; the CLI alias `--config
      ruff=...` sets only `config_paths['ruff check']` and
      `_SUPPORTED_CONFIG_KEYS` has no 'ruff format'. A consumer overriding the
      ruff config gets ruff check on the custom file but ruff format on the
      shipped config/ruff.toml; empirically `ruff format --config <shipped>`
      ignores the consumer pyproject line-length/format overrides. The
      shipped-config contract is met, so this is non-blocking; consider falling
      back to `config_paths['ruff check']` for ruff format, adding 'ruff format'
      to the config keys, or documenting the shipped-only behavior."
    location:
      file: src/python_setup_lint/runner/dispatch.py
      line: 412
  - id: stats-coverage-tautological-assert
    disposition: optional
    summary: Redundant tautological assertion in statistics coverage test
    detail: "`tests/runner/test_lint_runner_stats.py:75` asserts
      `STATISTICS_PARSER_TOOLS == frozenset(_STATISTICS_PARSERS)`, which is true
      by construction (dispatch derives the constant from that table) and cannot
      detect parser-table drift itself. The next assertion (TOOLS minus
      FORMATTER_ONLY equals the statistics set) carries the real coverage, and
      the new contract test repeats the equality as a drift guard. Keep or drop
      the redundant line; no coverage loss."
    location:
      file: tests/runner/test_lint_runner_stats.py
      line: 75
