recommendations:
  - "Implement the normalization exactly as specified: drop `msg`, keep None
    values, resolve+relativize absolute `file` paths against the temp project
    root with `as_posix()`, backslash->`/`, strip `./`, assert non-absolute, and
    sort with a None-safe key; compare sorted lists or Counters."
  - 'Pin the scenario: `path="."`, `fix=False`, `statistics=False`,
    `overwrite_baseline=True`, `PYTHON_SETUP_LINT_SEMANTIC=0`,
    `package_name="minimal_sample"`, temp capture path outside the project, and
    helper order copy -> git init/add -> `_make_config`. Use
    `isolated_runner_registries`.'
  - Make the snapshot run capture twice on two fresh temp copies and assert
    normalized equality before comparing to the committed golden; store the
    golden as canonical JSON (`indent=2`, `sort_keys=True`).
  - "Do not assert `run_lint` return code as lint success when
    `overwrite_baseline=True`: `_handle_baseline` forces 0 on successful
    capture, and positive tool failures with empty stdout are invisible to
    capture."
  - "Do not use raw lint stdout/logs as the golden: pyright `time`/`timeInSec`,
    absolute `absolutePath` values, rcfile paths, and per-tool `[Xs]` timings
    vary every run."
  - "Decide the coverage contract explicitly: if the golden must pin
    pylint/pylint-tests and the 5 parser-less tools, add a test-local json2
    record extractor (reusing the `messages` shape from `parsers.py:98-113`) or
    make a deliberate src change in `_record_parsers.py` + `parsers.py:231-241`,
    accepting the `lint.baseline`/golden regeneration that follows. Do not
    silently claim full behavior preservation from the 74-record capture."
  - Record the environment/tool versions alongside the golden or ensure CI
    regenerates/verifies with the uv lockfile; rule/message text is
    tool-version-sensitive.
