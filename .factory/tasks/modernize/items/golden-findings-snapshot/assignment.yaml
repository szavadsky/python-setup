title: Golden snapshot of normalized lint findings
assignment: "Implement M1 behavior-preservation contract per probe report (read
  probe findings first; implement its normalization spec). Dev kind to allow
  conditional bounded src fix; prod scope strictly bounded (see below), else
  tests-only. (1) Create tests/_golden.py SOLE owner:
  UPDATE_ENV=PYTHON_SETUP_LINT_UPDATE_GOLDEN,
  SEMANTIC_ENV=PYTHON_SETUP_LINT_SEMANTIC; Finding TypedDict
  {tool,file|None,line|None,col|None,rule}; finding_key(f) None-safe (tool,file
  or '',line if int else -1,col if int else -1,rule) mirroring
  _violation_sort_key; collect_findings(config,capture_path)->list[Finding]
  (run_lint baseline=capture_path/overwrite, read JSON, normalize: drop msg,
  relativize vs project, strip ./, backslash->/, as_posix, assert non-absolute,
  sort by key, assert len!=0); assert_matches_golden (Counter multiset diff,
  sorted added/removed; UPDATE=1: pytest.fail('refusing to rewrite golden under
  CI...') if CI/GITHUB_ACTIONS else warn+rewrite golden+counts together);
  read_oracle_rules, slice_tool_section, assert_oracle_coverage,
  assert_tool_coverage. (2) Commit
  tests/data/golden/minimal_sample_project_findings.json (sorted Finding array)
  + ..._tool_counts.json ({tool:min_count}),
  json.dump(indent=2,sort_keys=True)+trailing newline, outside sample dir, never
  copied/linted; violations.txt RETAINED as oracle. (3) Edit
  tests/integration.py test_setup_new_and_lint: keep first run (no baseline,
  rc!=0) AND retain tool-section/SKIPPED/[CRASH]/W9705 assertions; add dedicated
  second capture (caller owns tmp, copy, git-init, _make_config, SEMANTIC=0);
  replace substring loop with golden equality + oracle/tool coverage;
  brush-off/carry as tool-qualified lookups (pylint,mod.py:49 present/:56
  absent); drift injection on in-memory copies only. Bounded src allowance ONLY
  if probe proves test-side insufficient: runner/baseline.py
  (relativize/POSIX/sort) and runner/parsers.py|_record_parsers.py (ordering),
  <=40 added lines, determinism-only (no finding added/removed), reviewed diff
  in report; excluding any field dropping an oracle rule forbidden without ADR.
  Acceptance: integration, `pytest -q`, `lint` pass, empty lint.baseline, regen
  twice byte-identical."
