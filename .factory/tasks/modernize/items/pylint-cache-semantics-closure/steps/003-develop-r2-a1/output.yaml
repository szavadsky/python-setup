concerns:
  - The watchdog covers shipped rcfiles and runner defaults only; a consumer
    rcfile or --config pylint=PATH override with jobs>1 (or jobs=0 auto-detect)
    still voids the single-writer verdict, as now stated in the docstring. The
    epic must treat effective jobs==1 as a precondition, not an invariant of
    consumer projects.
  - The verdict remains intentionally pinned to pylint 4.0.6 behavior; upgrading
    pylint can fail the jobs-default, check_parallel/ProcessPoolExecutor, or
    writer-scan tests by design, requiring re-derivation rather than loosening
    assertions.
  - The runner seriality watchdog is a structural AST pin (no
    concurrent/multiprocessing imports; one _select_lint_tools loop containing
    _run_cmd), so a future refactor that preserves those shapes but adds
    concurrency elsewhere would still need review.
