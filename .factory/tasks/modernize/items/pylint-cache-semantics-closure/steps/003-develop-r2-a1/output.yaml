  an AST watchdog that runner code imports no concurrent/multiprocessing
  dispatch and _run_tool_pipeline blocks on _run_cmd in one _select_lint_tools
  loop, pinned ProcessPoolExecutor in pylint check_parallel, qualified the
  ~/.cache/pylint stats path as a Linux example, and made the writer
  single-caller scan match attribute-qualified calls. File is 485 lines (under
  the 500-line pylint cap); 21 tests in the file pass offline with the
  no_external_api marker."
