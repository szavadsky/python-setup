title: Harden golden via caller asserts and shared slicer
assignment: "GOAL: Harden golden contract via caller asserts and shared slicer
  per ADR-006; committed files never mutated by proofs. SCOPE: tests only.
  STEPS: Keep collect_findings(project,config) in tool order with no sort
  (synthetic-empty safe); sorting stays in serialize_write plus _diff_keys; add
  caller asserts in test_setup_new_and_lint (len findings not zero post-collect;
  first-run CRASH absent plus SKIPPED only package_name retained); keep
  Counter-multiset diff plus UPDATE guard failing under CI and GITHUB_ACTIONS
  plus oracle and tool coverage (read_oracle_rules, assert_oracle_coverage,
  assert_tool_coverage); use slice_tool_section(output,[pylint],[pylint-pyi]) in
  overlay test; extend tests/test_golden.py synthetic coverage for ordering,
  POSIX, diff keys, CI-guard, coverage, byte-format, empty-list safe; no Finding
  CRASH sentinel. Determinism via temp-copy double-collect: collect plus
  serialize on two fresh temp copies, sha256 hashes equal each other and equal
  committed golden hash. UPDATE_GOLDEN equals 1 never touches committed files
  except reviewed regen. VERIFY: integration plus test_golden pass; golden plus
  counts byte-identical."
