notes: "Item report for M3 (beartype discovery): with beartype 0.22.9 and `from
  __future__ import annotations`, a TYPE_CHECKING-only forward reference does
  NOT fail at import/decoration time; every call raises
  beartype.roar.BeartypeCallHintForwardRefException at CALL time, even when
  passed an instance of the intended runtime type (name cannot be resolved from
  module globals). Outcome is call-time, not import-time and not checker-only:
  @beartype silences the static missing-beartype rule but cannot enforce such
  signatures. Other observed pins: astroid 4.0.4 Module.stream().read() returns
  bytes (product decode-if-bytes yields exact UTF-8 source), doc_node is Const
  for module/class/function docstrings and None when absent,
  nodes_of_class(tuple) yields the union in document pre-order, and
  Const/JoinedStr expose exact int
  fromlineno/end_lineno/col_offset/end_col_offset; pylint 4.0.6 register_checker
  invokes no hooks while check() opens prepared checkers in checker-name order
  then closes in reverse, CheckerTestCase/UnittestLinter release_messages
  returns and drains list[MessageTest] with fields
  (msg_id,line,node,args,confidence,col_offset,end_line,end_col_offset), and
  MessageDefinitionTuple is a 3-or-4 element union whose leading positions are
  msgid/symbol/description with optional 4th ExtraMessageOptions. No src/
  changes; AGENTS.md untouched."
