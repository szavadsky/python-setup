concerns:
  - "GLiDE-0.4B has no full-corpus scores: the canonical run hit the 600s cap
    (~0.8-1.1 s/item, 0.4B params); only the 6-item smoke is available.
    Explicitly excluded from compliance, with timing evidence in report.md. It
    is the largest candidate (395M params), so it could not be the smallest
    compliant option anyway."
  - Ettin `query_first`/`rubric_query` and MiniLM `query_first`/`rubric_query`
    were deliberately stopped to protect the step budget; the production
    `current` prompt is fully scored for both, and the missing ablations are
    explicitly listed as exclusions in report.md.
  - The contracted heuristic-accepted stratum has zero negative examples, so the
    95% meaningless-precision bar cannot be evaluated; the 39 synthetic hard
    negatives are author-written, single-adjudicator sensitivity data, not a
    substitute for real repo brush-offs. The formal no-go therefore reflects
    corpus structure, not only model quality.
  - bekko/ettin/MiniLM latency samples overlapped the GLiDE run on the same CPU,
    so their p50/p95 (and GLiDE's) are upper bounds under contention; decider
    runs were measured alone. Accuracy/compliance are unaffected.
  - Repo labels are single-adjudicator; the threshold/table labels assert the
    heuristic's own behaviour, so heuristic accuracy is 100% on the contracted
    corpus by construction.
  - Reranker scores are sigmoid(relevance logit), not calibrated decision
    probabilities, so the threshold sweep is a ranking sweep rather than a
    calibrated operating point.
notes: "The recommended next move is not to adopt a model: on the contracted
  corpus the heuristic already achieves 100% accuracy/recall on the accepted
  stratum, and the precision bar is unevaluable because the stratum has no
  negatives. To make a future go/no-go meaningful, add an independently
  double-rated sample of real repo suppressions that are heuristic-accepted but
  meaningless. If a full GLiDE row is required, rerun `eval/adapters/glide.py
  --prompts canonical` with a >600s CPU budget; the report and metrics
  regenerate from `out/scores__glide__canonical.jsonl` and
  `out/meta__glide__canonical.json` without code changes."
