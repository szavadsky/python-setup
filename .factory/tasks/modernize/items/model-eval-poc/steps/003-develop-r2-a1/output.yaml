status: ok
summary: "Resolved all four FIX suggestions and the three cheap OPTIONAL ones
  inside the PoC. Rebuilt the corpus one-item-per-suppression-line with joined
  codes (kills the c149/c165 double-count contradiction), aligned reranker
  queries to production `_semantic.py:168-176` (present fields only; self-pair
  when rule+context absent), standardized synthetic rules to None, and separated
  the contracted corpus from the 39-item hard-negative augmentation (reported as
  sensitivity only). Implemented eval/metrics.py (all thresholds 0.5/0.6/0.7 x
  veto/replace x contracted/augmented x accepted/rejected/overall + per-source,
  p50/p95/RSS, lexicographic smallest-compliant) and eval/report.py (report.md).
  Full n=336 runs completed cleanly (0 errors) for decider-nano (3 prompts),
  bekko-17m (3 prompts), ettin-reranker current, and MiniLM current; GLiDE-0.4B
  full canonical was explicitly excluded after its 600s CPU run timed out (smoke
  6 rows only; it is the largest candidate and cannot be the smallest
  compliant). Result: 0 compliant candidates on both contracted and augmented
  corpora; formal recommendation is no-go, because the contracted
  heuristic-accepted stratum has 215 meaningful / 0 meaningless items so the 95%
  meaningless-precision bar is vacuous and no model can be certified."
target:
  command: cd .factory/tasks/modernize/items/model-eval-poc/poc && python3
