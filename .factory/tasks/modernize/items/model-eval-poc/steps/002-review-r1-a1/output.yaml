      smallest-compliant (params,bytes,RSS,p50) recommendation or no-go.
      Developer output.yaml status=blocked confirms. Resume by scoring all 340
      items, then implement metrics + feasibility report."
    location:
      file: .factory/tasks/modernize/items/model-eval-poc/poc/out/meta__glide__canonical.json
      line: 14
  - id: reranker-query-contract-deviation
    disposition: fix
    summary: Reranker query uses '(unknown)/(none)' placeholders where production
      uses self-pair
    detail: "Production _semantic.py:168-176 builds query from present fields only
      and falls back to self-pair (primary,primary) when rule and context are
      both absent. PoC render_query always emits 'rule: (unknown) | context:
      (none)' for the 114 synthetic rows with rule=None+context=None, and
      appends '| context: (none)' to rule-only rows (39 hard negatives).
      Ettin/MiniLM scores then measure justification-vs-placeholder relevance,
      incomparable to production and to the threshold sweep. Align with
      production query construction or record an explicit, ablated deviation."
    location:
      file: .factory/tasks/modernize/items/model-eval-poc/poc/eval/adapters/common.py
      line: 35
  - id: repo-label-contradiction-c149-c165
    disposition: fix
    summary: Contradictory labels on identical preceding-line misattributions (c149
      true vs c165 false)
    detail: "c149 ('Extract the value type name', True) and c165 ('Count function
      parameters (excluding self/cls)', False) are the same phenomenon: a
      preceding-line descriptive comment misattributed to a trailing ty:ignore
      on a multi-suppression line whose true same-line reason was already paired
      with the first suppression (verified generic_key_dict_checker.py:93,
      trivial_wrapper_checker.py:223). With only 3 repo rows labeled
      meaningless, this single flip corrupts the accepted-stratum meaningless
      denominator (41 items). Reconcile the pair and fix multi-suppression
      double-counting (one line yields two items); join codes per contract or
      exclude the spurious second row."
    location:
      file: .factory/tasks/modernize/items/model-eval-poc/poc/data/corpus.jsonl
      line: 149
  - id: hard-negatives-outside-contract
    disposition: fix
    summary: 39 synthetic hard negatives (95% of accepted meaningless class) added
      outside contracted corpus
    detail: "_HARD_NEGATIVES defines 40 items (39 post-dedup; 'not my code' collides
      with the brushoff table) that become 39/41 heuristic-accepted meaningless
      items, so the 95% meaningless-precision bar is decided by author-written
