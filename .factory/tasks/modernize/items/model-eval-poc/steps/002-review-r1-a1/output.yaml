      augmentation as sensitivity analysis, or obtain architect approval to
      redefine the corpus. Also standardize synthetic rule (hard negatives use
      W9704, table rows use None)."
    location:
      file: .factory/tasks/modernize/items/model-eval-poc/poc/eval/corpus.py
      line: 146
  - id: decision-state-placeholders
    disposition: optional
    summary: Decision prompts inject '(unknown)'/'(none)' literals for None rule/context
    detail: render_state substitutes placeholder strings for 114 rows with
