suggestions:
  - id: incomplete-full-matrix-eval
    disposition: fix
    summary: Full-matrix scoring, metrics, and recommendation missing (only n<=8
      smoke scores)
    detail: "out/ holds 5 smoke-only runs (decider n=8, glide n=3,
      bekko/ettin/minilm n=4); eval/ has no metrics.py and poc has no report.md.
      Missing per contract: ALL candidates x prompts at 0.5/0.6/0.7 in veto AND
