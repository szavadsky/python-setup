iteration: 2
milestones:
  - directionalInterfaces:
      - runner/dispatch.py TOOLS[1]=ToolSpec('ruff format', ['ruff','format'],
        supports_fix=False, default_paths=['src/','tests/']); runner/_config.py
        maps 'ruff format'->'ruff.toml'; cmd_build._config_flag_for returns
        ['--config', path] and _build_command appends '--check' when not fix;
        cli.py phase 1a formats only under --fix, normal pass checks.
      - "Registry invariant single source: EXPECTED_TOOLS=frozenset(t.name for t
        in TOOLS) with len 14; RECORD_PARSER_TOOLS subset; FORMATTER_ONLY={'ruff
        format'} explicitly exempt from statistics-parser coverage; tests import
        it instead of hardcoding 13."
      - "Docs contract: AGENTS.md counts = runtime collect-only +
        len(TOOLS)==14; cli.py:314 help 'all 14 tools'; tool_counts.json keeps
        14 keys including 'ruff format':0."
    id: M1
    scenarios:
      - >-
        Scenario: Gates green on clean checkout
          Given clean HEAD with empty lint.baseline
          When format, lint, `pytest -q`, and integration gates run
          Then all pass: 6 tool-count failures fixed, SIM102 and too-many-locals fixed, lint.baseline stays []
      - >-
        Scenario: Lint never mutates
          Given a clean worktree
          When `uv run lint` runs without --fix
          Then git status shows no tracked modifications and ruff format runs with --check --config config/ruff.toml
      - >-
        Scenario: Registry contract single-sourced
          Given the TOOLS table
          When tests and docs read the tool count
          Then every assertion reads 14 from one helper and formatter-only exemption is explicit
    title: Green baseline and 14-tool runner contract
  - directionalInterfaces:
      - "tests/_project_helpers.py (sole site): copy_sample_project,
        git_init_and_stage (test/test@test + add .), git_init_bare
        (Test/test@example.com, -q, no add), stage_file, commit_all,
        shipped_config_paths, make_runner_config (package_name + rumdl override,
        idempotent, no-op when shipped rumdl missing),
        build_pylint_overlay_config(project, disable_rule)->Path,
        ensure_precommit_or_skip()->None,
        install_twice_assert_idempotent(project, monkeypatch)->None. Consumers
        import mapped subsets only."
      - "tests/_golden.py: collect_findings(project,*,config)->list[Finding] via
        private pipeline subset + _RECORD_PARSERS, normalize, sort by
        finding_key, assert len!=0 and zero __CRASH__; assert_matches_golden
        Counter-multiset diff with UPDATE guard (pytest.fail under
        CI/GITHUB_ACTIONS); read_oracle_rules, slice_tool_section (used by
        overlay test), assert_oracle_coverage, assert_tool_coverage."
    id: M2
    scenarios:
      - >-
        Scenario: Shared helpers exist once
          Given tests/_project_helpers.py
          When tests/ is searched
          Then each helper is defined exactly once there, duplicates in conftest.py and _autofix_helpers.py are deleted, and each consumer imports only its mapped subset
      - >-
        Scenario: Integration gate within limits
          Given extracted helpers plus moved scaffolding (>=127 removed, target <=490)
          When `uv run pytest tests/integration.py -v` runs
          Then tests/integration.py is <=500 lines with no suppression, names unchanged, all pass, golden+counts byte-identical
      - >-
        Scenario: Golden hardening holds
          Given the committed golden
          When integration runs plus synthetic drift injection
          Then findings are sorted with len!=0 and zero __CRASH__, drift names exact added/removed keys, oracle and per-tool coverage hold, and regen twice is byte-identical
    title: Test infra consolidation and golden hardening
  - directionalInterfaces:
      - DecisionBackend Protocol decide(justification,rule,context)->float in
        [0,1]; DECISION_THRESHOLD + PROMPT_VERSION='prompt-v1'; labelled corpus
        = threshold patterns + brush-off/meaningful tables + real repo
        suppressions; eval report {model, threshold, precision, recall, p50/p95
        latency, RSS, recommendation}.
      - Tracked cache JSON array sorted by (rule,justification,model), indent=2
        sort_keys=True; entry {version, model id/revision, prompt hash, full
        digest key, decision, files sorted POSIX, last-seen}; refresh via
        explicit command/flag only; CI guard refuses rewrite; isolation via
        PYTHON_SETUP_LINT_DECISIONS_PATH.
      - "Pylint semantics contract: jobs/process count, open()/close() timing,
        partial/staged-run behavior across pylint/pylint-pyi/pylint-tests;
        verdict selects lock/merge/sweep vs jobs=1 vs sidecars."
    id: M3
    replanAfter: true
    scenarios:
      - >-
        Scenario: Model choice is evidence-based
          Given the labelled corpus on CPU
          When the poc scores decider-nano (+GLiDE if obtainable) at 0.5/0.6/0.7
          Then the report names precision/recall/latency per threshold and recommends the smallest compliant model+prompt+threshold or a no-go
      - >-
        Scenario: Cache design is deterministic
          Given the proposed schema on a temp copy
          When W9704 runs with model absent, present, and cache-hit
          Then verdicts are identical, prune policy drops stale/deleted entries, and normal lint performs zero writes
      - >-
        Scenario: Cache concurrency is pinned
          Given pylint 4.x invocation tests
          When jobs/hook/partial-run semantics are pinned
          Then the cache lock/merge/sweep design is confirmed or constrained to jobs=1/sidecars by test
    title: Decision-model and git-cache design spikes
  - directionalInterfaces:
      - "Row schemas: coding-rules {module, section, evidence file:line,
        category, est. LoC delta, owner, fix}; test-debloat {module, behaviors,
        duplicate-of, recommendation, surviving coverage, reason, owner}.
        Artifact = structured item-report tables (orchestration records; no
        committed file); coding audit owns the unified map; test audit aligns
        via inter-dep; iteration-3 replan re-globs HEAD before spawning epics."
      - "Exclusions (marked skipped): src side _semantic.py+.pyi, new
        backend/cache modules, _base.py::check_if_meaningful,
        _OPTIONAL_IMPORT_PATTERNS; tests side test_semantic_check.py,
        test_semantic_threshold.py, TestSuppressionRerankerPipeline,
        epic-created conftest/runtime modules."
    id: M4
    replanAfter: true
    scenarios:
      - >-
        Scenario: Coding-rules debt inventoried
          Given CodingRules.md and AGENTS.md
          When the audit completes
          Then every src/scripts module is listed with violations plus the unified ownership map; semantic symbols are marked skipped
      - >-
        Scenario: Test redundancy inventoried
          Given tests/ and the golden
          When the audit completes
          Then each module has keep|merge|rewrite|remove with surviving coverage, repo-self-lint tests are listed for removal, and each material limb names pinning tests or blocking debt
      - >-
        Scenario: Ownership map is complete and disjoint
