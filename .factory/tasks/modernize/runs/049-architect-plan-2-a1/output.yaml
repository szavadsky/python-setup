adrs:
  - consequences: "`uv run lint` becomes check-only and hermetic; declared split
      gates can reunify once merged. Tool-count docs/tests stabilize on 14.
      Phase 1a keeps mutating format under --fix only."
    context: "`ruff format` ToolSpec runs plain `ruff format` without
      --check/--config, rewriting ~109 files with default line-length 88 instead
      of shipped 130, while TOOLS has 14 entries and 6 tests + docs assert 13."
    decision: Retain 14 tools. Map 'ruff format' to config/ruff.toml, pass --config,
      append --check in the normal pass; mutate only in phase 1a under --fix.
      Single-source the 14-name registry invariant; formatter-only tools are
      explicitly exempt from statistics-parser coverage.
    id: ADR-005
    title: Ruff format check-only contract with shipped config
  - consequences: Golden stays byte-identical; drift detection gains explicit
      crash/empty sensitivity. Overlay test uses the shared slicer. No blind
      regen.
    context: Merged collect_findings uses private pipeline + record parsers (not
      run_lint baseline capture), sorts only in serialize, never asserts len!=0
      or zero __CRASH__, and slice_tool_section is unused.
    decision: "Ratify private-pipeline collect as intentional (avoids second full
      run and formatter pollution). Harden it: sort by finding_key in collect,
      assert len!=0 and zero __CRASH__, use slice_tool_section in the overlay
      test."
    id: ADR-006
    title: Golden contract hardening on merged implementation
  - consequences: Lint stays hermetic and deterministic with/without the model;
      cache updates are explicit, reviewable, CI-guarded. Iteration 3 implements
      the backend against this contract.
    context: Current cache is per-machine, gitignored, unbounded, 64-bit truncated
      keys, no cleanup. A git-tracked cache that lint writes on every run would
      make lint non-hermetic.
    decision: Tracked cache is the source of truth; normal lint is read-only
      (cache-hit + heuristic). Writes happen only via an explicit refresh
      command/flag. Schema carries version, model id/revision, prompt hash, full
      digest key, boolean, last-seen; prune policy proven by spike.
    id: ADR-007
    title: Read-only lint with explicit cache refresh
  - consequences: Subsystem epics start in iteration 3 scoped from evidence with
      disjoint ownership; semantic implementation follows spike verdicts. No
      concurrent edits to shared test infra.
    context: Remaining scope spans runner, checkers, setup/testing plus the semantic
      swap. Audits must read final post-consolidation HEAD before epic
      decomposition.
    decision: Iteration 2 delivers green baseline, test-infra completion,
      model/cache spikes, and read-only audits. Iteration 3 spawns
      runner/checkers/setup-testing-scripts epics from the unified ownership map
      plus the semantic implementation epic.
    id: ADR-008
    title: Progressive epic decomposition after audits
assumptions:
  - assumption: Material behavior = golden findings (SEMANTIC=0) + checker unit
      tests + CLI flags/exit codes + baseline/autofix semantics + shipped
      configs/scopes. Reranker accept/reject is not material; heuristic
      rejections (empty, boilerplate, brush-off, rule-echo) are material.
    disposition: confirm with human
    why: Makes 'preserve every material behavior' mechanically testable while
      allowing the model swap.
  - assumption: Git-stored decision cache lives in the linted repo (e.g.
      .python-setup-decisions.json next to lint.baseline); weights stay in the
      user model cache, never in git.
    disposition: confirm with human
    why: Decisions must reproduce in CI without the model; weights are 0.03-0.8GB
      with their own licenses.
  - assumption: Dev/CI do not install the `semantic` extra; gates run heuristic +
      cache hits. Real-model tests are slow + with_real_api and never in the
      default suite.
    why: Matches current venv (no torch/transformers) and keeps gates offline, fast,
      deterministic.
  - assumption: "'Never test linting' bans pytest asserting this repo passes its own
      gates (subprocess re-lint, AST re-implementation, config re-checks).
      Golden/integration behavior contracts are retained, not removed."
    disposition: confirm with human
    why: Removes gate-duplicating tests without deleting the fit-for-purpose
      behavior contract.
  - assumption: GLiDE-0.4B Fastino Community License is not accepted until human
      review; spikes prefer Apache-2.0 candidates and exclude CC-BY-NC. If no
      candidate meets license + CPU + py3.14 + accuracy bar, the epic escalates
      instead of shipping non-compliant.
    disposition: confirm with human
    why: MIT package cannot absorb unclear/non-commercial model licensing by
      default.
  - assumption: tests/integration.py, `uv run pytest -q`, `uv run pytest
      tests/integration.py`, split format/lint gates are gate contracts;
      paths/commands do not change. Never run bare `uv run lint` or
      --overwrite-baseline; captures run on temp copies only.
    why: Bare lint mutates the worktree via ruff format; split gates are the
      check-only workaround until M1 merges.
  - assumption: Only semantic-decision-model spawns now (implementation in iteration
      3 after spikes); runner/checkers/setup epics spawn at the iteration-3
      replan from M4 audits.
    why: Debloat and model work must follow the green baseline, consolidated infra,
      and evidence-based ownership.
epics:
  - intent: >-
      # semantic-decision-model


      Replace the cross-encoder reranker behind suppression-justification with a
      CPU-friendly small decision model plus a git-stored self-cleaning decision
      cache. Preserve every material behavior. Child epic of `modernize`.
      Consumes iteration-2 spikes (candidate matrix, CPU eval, cache design,
      pylint semantics); implements in iteration 3.


      ## Scope (symbol-level)

      Owned: checkers/_semantic.py+.pyi and new private backend/cache modules
      (+.pyi each, @beartype, structlog kwargs, tach-clean); check_if_meaningful
      in checkers/_base.py+.pyi; _OPTIONAL_IMPORT_PATTERNS in
      no_try_import_checker.py; pyproject [semantic] extra + uv.lock +
      .gitignore entries + hatch inclusion for tracked cache; docs
      (semantic-justification.md, custom-checks.md bullet, troubleshooting.md
      section, AGENTS.md pipeline section only, CHANGELOG); tests:
      test_semantic_check.py, test_semantic_threshold.py,
      TestSuppressionRerankerPipeline, new decision/cache modules,
      tests/checkers/conftest.py, runtime-assumption modules under
      tests/assumptions/.

      Protocol: NEVER write tests/data/** (read golden for verification only);
      if heuristic outcomes shift, emit shift report + CHANGELOG behavior
      description and root regenerates golden. AGENTS.md pipeline section only
      on HEAD containing M2 merge, never count lines. tests/assumptions
      append-only. Out of scope: other checkers/runner; tests/integration.py,
      tests/conftest.py (no edits). Any runner touch minimal + ADR.


      ## Requirements

      1. Implement the spike verdict: chosen model id/revision, prompt (noul
      question + criteria), threshold meeting >=90% acc / >=95%
      meaningless-precision / >=85% meaningful-recall, or escalate on no-go. No
      unpinned trust_remote_code; exclude non-commercial licenses.

      2. Contract: keep
      check_if_meaningful(text,*,rule,code_context,comment)->bool and
      PYTHON_SETUP_LINT_SEMANTIC ('0'=heuristic only, semantic never imported).
      Heuristic-first hard gate. semantic_check_if_meaningful keeps bool|None
      (None=unavailable, heuristic stands). Public DecisionBackend Protocol
      decide(justification,rule,context)->float in [0,1]; DECISION_THRESHOLD +
      PROMPT_VERSION constants. Injection: optional backend kwarg (public in
      .pyi) + test-only PYTHON_SETUP_LINT_DECISION_BACKEND dotted path. No
      patching globals/imports, no private imports.

      3. Packaging: `semantic` extra ships chosen runtime (drop
      sentence-transformers). Without extra or on failure: heuristic + cache
      hits, one warning, sentinel. Weights in user cache, never git.
      PYTHON_SETUP_LINT_DECISION_MODEL selects model@revision;
      PYTHON_SETUP_LINT_RERANKER_MODEL deprecated (warn + ignore).

      4. Cache (.python-setup-decisions.json at linted root): JSON array sorted
      by (rule,justification,model), indent=2 sort_keys=True. Entry
      {justification normalized, rule joined codes, model '<id> rev <short12>
      prompt-vN' with no bare hex>=20, decision, files sorted POSIX relpaths}.
      Key (justification,rule,model). Normal lint read-only; explicit refresh
      command/flag writes via lockfile + merge + atomic temp+move. Sweep scoped
      to linted files; drop empty-files + stale-model entries. Isolation via
      PYTHON_SETUP_LINT_DECISIONS_PATH. Must pass all tools incl.
      detect-secrets.

      5. Real suppressed codes: extract all codes from disable/noqa/ignore,
      normalize/sort/join ','' as rule (bare-except keeps single symbol).
      Rule-echo rejects on any element match. On heuristic shift: shift report +
      CHANGELOG description, root regenerates golden.

      6. Tests: merge brush-off/meaningful/threshold tables into one
      parametrized table; FakeBackend via kwarg + env var; cache
      round-trip/cleanup/concurrency on tmp + hypothesis format round-trip;
      exactly one slow+with_real_api e2e; delete vacuous `is None or ...`
      assertions and ImportError-propagation test; modules <=500 lines, no
      suppressions; never test linting.

      7. Docs: update Scope list + CHANGELOG (user-visible only).


      ## Acceptance

      - SEMANTIC=0 sample lint equals golden (read-only verification).

      - Cache without model: cached false decision => W9704 emitted, no model
      load.

      - Brush-off never reaches model; one call per unique (justification,rule);
      scoped cleanup; no retry storm.

      - Gates: format, lint, `pytest -q`, integration all green with empty
      lint.baseline.
    slug: semantic-decision-model
