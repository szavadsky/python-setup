    title: Debloat inventory and subsystem epic decomposition
techDebt:
  - category: blocking
    description: "`ruff format` ToolSpec mutates the worktree (plain `ruff format`,
      no --check/--config, default line-length 88 vs shipped 130); every `uv run
      lint` dirties ~109 files."
    id: TD2-B1
    resolution: "Resolved by runner-format-contract: shipped-config --check in
      normal pass, mutating format only in phase 1a under --fix."
  - category: blocking
    description: "Red baseline: 6 tests assert 13 tools vs 14-entry TOOLS; SIM102 at
      stub/coverage.py:196; too-many-locals 23/20 at runner/cli.py:50. Empty
      lint.baseline masks real violations."
    id: TD2-B2
    resolution: Resolved by runner-format-contract (14-tool update) +
      baseline-violations-fix (SIM102 + split pipeline); lint.baseline stays [].
  - category: impacting
    description: tests/integration.py 661 lines with too-many-lines suppression;
      helpers duplicated across integration/conftest/_autofix_helpers.
    id: TD2-I1
    resolution: Resolved by consolidate-integration-helpers retry (tests-only,
      golden byte-identical, <=500, no suppression).
  - category: impacting
    description: "Golden interface drift: collect signature/behavior vs plan,
      missing sort/len/crash asserts, unused slice_tool_section."
    id: TD2-I2
    resolution: Resolved by golden-contract-hardening (ratify + harden, no blind regen).
  - category: impacting
    description: Semantic tests patch module globals and builtins.__import__, import
      privates under type:ignore, carry vacuous `is None or ...` asserts;
      heuristic tables duplicated across two modules.
    id: TD2-I3
    resolution: Resolved by semantic epic implementation in iteration 3 (FakeBackend
      injection, merged table, modules <=500).
  - category: impacting
    description: W9704/W9738 pass their own symbol as `rule`; rule-echo heuristic
      and future model never see the actually-suppressed codes.
    id: TD2-I4
    resolution: Resolved by semantic epic req5 (joined suppressed codes, echo on any
      element, shift report + root regen).
  - category: adjacent
    description: "Over-limit/duplicated test infrastructure: _factories.py 1393
      lines, _factories_extras.py 502 lines with duplicate disables, 3
      baseline-diff + 3 runner files overlapping, test_golden.py 341 lines of
      helper-unit tests."
    id: TD2-A1
    resolution: Inventoried by test-debloat-audit; iteration-3 checkers/runner epics
      merge/split per CodingRules.
  - category: adjacent
    description: "Legacy/compat and docs drift:
      _FALLBACK_TOOLS/peek/_compare_sorted, astroid 3.x fallback, dispatch.py
      500+ char rationale with self-suppression, rumdl tests/data-exclude hack,
      ADR design/ vs docs/adr split, factory-journal detect-secrets noise."
    id: TD2-A2
    resolution: Inventoried by audits; iteration-3 epics remove/fix; factory-journal
      exclusion is operator/engine action if still flagged.
uncertainties:
  - description: "Which decision model (if any) meets license + CPU + py3.14 +
      accuracy is unknown. GLiDE-0.4B: Fastino license, 0.81GB bf16,
      CUDA-tested, torch 2.14/transformers 5.17. Apache alternatives
      (decider-nano 149M, bekko-17m, ettin-150m) vary in accuracy/license/CPU
      proof. No CPU benchmark exists in this environment."
