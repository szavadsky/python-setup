summary: Citation-backed context pack for the `modernize` intent. It maps the
  checker/runner architecture, the current W9704 semantic pipeline and its
  cache, the behavior-preservation gates (golden snapshot + assumptions tests),
  the current red baseline (6 unit-test failures caused by stale 13-tool
