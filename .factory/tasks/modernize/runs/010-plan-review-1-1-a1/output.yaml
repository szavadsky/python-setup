status: changes_requested
summary: "changes_requested: bounds pass (3/8 milestones, 5/50 items, acyclic)
  but 28 fix block: golden rc/oracle/config/crash/POSIX/diff, 500-line math, git
  semantics, ownership/disjoint, cache/injection/threshold; 3 awareness, 3
  optional"
suggestions:
  - id: golden-reuse-breaks-rc
    disposition: fix
    summary: Reusing existing run with overwrite_baseline breaks rc assertion
    detail: "test_setup_new_and_lint asserts rc!=0. run_lint with
      baseline+overwrite_baseline=True forces rc=0 via _handle_baseline. Item
      requires both 'prefer extending existing run' and baseline capture with
      overwrite=True, but run_lint returns only int (no results). Fix: allow
      second run, or change assertion to len(records)!=0, or allow src change to
      expose results."
    location:
      file: tests/integration.py
      line: 128
  - id: violations-oracle-deleted
    disposition: fix
    summary: Deleting violations.txt removes planted-rule oracle
    detail: "M1 scenario 'checked against planted rule list' needs oracle. Only
      _read_violation_rules uses violations.txt, so after replacement 'if
      nothing else references it' is true and file deleted, making coverage
      check golden-vs-itself (circular). Fix: retain violations.txt as oracle or
      define new checked-in expected-rule set and update scenario."
    location:
      file: tests/data/minimal_sample_project/violations.txt
      line: 1
  - id: golden-interface-missing-config
    disposition: fix
    summary: M1 interface omits package_name and rumdl override
    detail: "Current _make_config sets package_name='minimal_sample' and rewrites
      rumdl.toml to remove tests/data exclusion. Interface specifies
      RunnerConfig(cwd, config_paths=shipped_config_paths()) with no
      package_name and no override. Omitting package_name changes SKIPPED
      behavior; omitting override changes rumdl findings. Fix: pin interface to
      use _make_config or include both steps."
    location:
      file: tests/integration.py
      line: 83
  - id: golden-crash-null-schema
    disposition: fix
    summary: Golden schema cannot represent crash/None records
    detail: "_capture_one emits {file:None,line:None,col:None,rule:'__CRASH__'} for
      exit<0. Interface defines Finding
      {tool:str,file:str,line:int,col:int,rule:str} non-nullable. No
      representation for crashes; comparison would error or silently drop
      crashes (test asserts no [CRASH]). Fix: define crash handling (sentinels,
      nullable, or separate no-crash assertion)."
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 133
  - id: golden-posix-normalization-gap
    disposition: fix
    summary: POSIX guarantee contradicts baseline relativize
    detail: "Scenario requires project-relative POSIX paths. _relativize_file uses
      str(p.relative_to(cwd)) which yields backslashes on Windows. Interface
      says 'use _capture_baseline schema with msg removed' (no POSIX
      conversion). Fix: specify test-side as_posix() normalization or allow src
      helper."
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 161
  - id: golden-diff-msg-collapse
    disposition: fix
    summary: Msg-less diff logic, Finding type and duplicates undefined
    detail: "Baseline equality includes msg via _violation_tuple; two-pointer diff
      relies on it. Golden drops msg so cannot reuse directly; same 5-tuple with
      different msg collapses, multiset-vs-set unspecified. Finding type/module
      and collect_findings/assert_matches_golden ownership undefined; 'it
      rewrites' ambiguous. Fix: define Finding, module, and golden diff (e.g.,
      Counter on 5-tuple, sorted) with added/removed formatting."
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 62
  - id: u3-inside-story-no-src
    disposition: fix
    summary: U3 determinism work inside no-src story
    detail: "U3 lists R0801 ordering, detect-secrets ls-files, pyright/mypy churn,
      absolute leakage. Outline says 'Inside golden-findings-snapshot: normalize
      or exclude unstable field' while story declares 'No src/ changes'.
      Parser/baseline fixes impossible; excluding duplicate-code (planted rule)
      contradicts 'every planted rule appears'. Fix: isolate into spike (or
      allow src) and forbid excluding planted rules without ADR."
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 48
  - id: m2-500-math-impossible
    disposition: fix
    summary: Helper extraction alone cannot reach <=500 lines
    detail: "File is 627 lines. Helpers total ~61 lines; 627-61=~566, minus M1 loop
      removal ~15 = ~551, still >500. Item only authorizes extracting helpers,
      keeping test names. Fix: authorize moving additional blocks (overlay/setup
      scaffolding) with explicit line budget or split strategy."
    location:
      file: tests/integration.py
      line: 12
  - id: m2-git-init-semantics-diverge
    disposition: fix
    summary: Single git_init underspecifies add vs no-add
    detail: "integration._init_git does init+config+add . (needed for
      detect-secrets); autofix._git_init does init+config only. Interface
      collapses to git_init(project)->None without specifying add/commit. Unify
      to no-add breaks golden; unify to add-all may break staged-file tests.
      Fix: define semantics (init+config+add) plus separate stage/commit helpers
      and list call-site updates."
    location:
      file: tests/integration.py
      line: 44
  - id: m2-interface-omits-make-config
    disposition: fix
    summary: M2 interface omits _make_config and import migration
    detail: "Item says extract
      _copy_sample,_init_git,_shipped_config_paths,_make_config plus leftovers.
      Interface lists only 3 (omits make_config/rumdl override). Unclear whether
      conftest keeps re-export wrapper (violating 'defined exactly once') or all
      consumers (e.g., test_self_lint_clean imports from conftest) switch to
      tests._project_helpers. Fix: list full set, define re-export vs direct
      import, clear tach for _SHIPPED_CONFIG_FILES import."
    location:
      file: tests/conftest.py
      line: 170
  - id: m2-broken-assumption-unfalsifiable
    disposition: fix
    summary: Future-upgrade scenario not falsifiable today
    detail: "Scenario 'Given dependency upgrade... Then failing test is assumption
