    location:
      file: pyproject.toml
      line: 52
  - id: beartype-assumption-needs-proof
    disposition: fix
    summary: Beartype forward-ref failure asserted without evidence
    detail: "Item claims TYPE_CHECKING-only annotation 'fails at call time' as
