        rows, repo-root except packaging exception); exclusions (_semantic+.pyi,
        _base::check_if_meaningful incl :238, _OPTIONAL_IMPORT_PATTERNS +
        register line, semantic test modules + pipeline block); planned paths
        (_decision_backend/_decision_cache, conftest reservation); artifact =
        item report, informational, non-gating."
      - "Gate baseline table: {format exit, lint per-tool, pytest counts,
        integration 9-collected with pre-commit env, golden hash, baseline []} +
        `uv run lint` check-only verification (git status clean) confirming
        split-gate reunification or retaining split."
      - "Secrets verification: full git-ls-files scan exit 0 on clean checkout +
        planted control secret exit 1 (reviewer-replicated), cited with pinned
        HEAD; journals committed."
    id: M1
