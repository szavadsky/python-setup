context: non-item
decision: accept-with-debt
rationale: "Waves 6-8: 0 merges, 0 regressions, 4/4 gates green, tree clean.
  Stall is orchestration, not code: stale I4 bases (tip-vs-HEAD reverts I2-I4
  merges), exit-127 unknown-gate 'tests' (infra gates are
  format/lint/test/test-integration), and 50-item cap overflow (69 total; prunes
  discarded at 52/51). Failed cache/stream already replanned as
  storage-v2/refresh-v2 and stream-v2; blocked docs/semantic superseded by
  docs-v2/doubles+pin-v2. Further waves in I5 cannot fit cap or rebase stale
  branches."
text: "End I5 infra-only; close-up must not claim model swap complete. I6
  carries, from fresh HEAD: wave-1 dep-free M1/M2 (cache-contracts,
  loader-contracts, matrix, corpus, pyi-spike, harness, runner-helpers, source,
  legacy-v2; ruff-fix already at HEAD dispatch.py:312-336, verify only), then
  doubles+storage, then stream-v2 deps [legacy-v2,doubles] cherry-picking
  owned-12 from abandoned branch, then refresh-wiring-v2 staggered after stream
  (suppression single-writer), then pin-v2/wiring-v2/docs-v2/hatch-v2/gate-v2.
  Target discipline: {command:uv run pytest -q,customTarget:true} never gate
  tests. Drop consolidate-v2/v3 (superseded by merged i2) and 13 stranded I4
  pendings."
debt: "I6 backlog: M1 contracts+spikes, M2 harness/runner/source/legacy-v2
  (+ruff verify-only), M3 stream-v2 then storage-v2/refresh-v2, M4
  pin-v2/wiring-v2 (default NO-GO without U1 verdict + Fastino + second-rater
  approvals), M5 pyi/docs-v2/hatch-v2/gate-v2; merge-path target discipline +
  fresh-HEAD owned-only diffs."
remarkable:
  - alternatives:
      - Schedule another fix-item in I5 (worsens 69/50 cap)
      - Abort task despite green gates and clean tree
    chosen: End I5 with debt and restart v2 chain in I6 with fresh budget/bases
    why: Cap overflow and stale bases are iteration-scoped; only a new iteration
      resets both while preserving green HEAD and v2 plan
