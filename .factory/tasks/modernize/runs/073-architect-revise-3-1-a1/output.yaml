        {runner,checkers,setup-testing,semantic,root}; ownership universe =
        src/** + scripts/** + tests/** EXCLUDING tests/data/**; root-owned group
        (tests/data, config, docs, repo-root files, epics read-only);
        symbol-exclusion column (incl. _base.py:238 rule-echo line as
        semantic-owned); planned-path reservations; drift list for stale
        evidence lines. Artifact = item-report tables with map revision ID
        (durable orchestration records)."
      - .secrets.baseline filters_used gains the ^\.factory/ should_exclude_file
