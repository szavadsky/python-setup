      violations.txt as human-readable oracle, or define new oracle (e.g.,
      derived rule set checked into golden test) and update scenario. Deleting
      without replacement makes coverage check circular."
    disposition: fix
    id: violations-delete-vs-list
    location:
      file: tests/data/minimal_sample_project/violations.txt
      line: 1
    summary: Deleting violations.txt removes planted-rule oracle
  - detail: Epic owns check_if_meaningful inside _base.py (not whole file),
      _OPTIONAL_IMPORT_PATTERNS inside no_try_import_checker.py, and
      TestSuppressionRerankerPipeline inside
      test_suppression_justification_checker.py, plus new backend/cache modules.
      M3 says 'Exclude files owned by semantic-decision-model' and 'every
      src/scripts module listed' / 'each test module' — file-level exclusion
