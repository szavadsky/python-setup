      debt but techDebt uses only adjacent|impacting and no blocking handling
      defined. Specify report location/format and how replan consumes disjoint
      ownership, and define blocking vs impacting."
    disposition: fix
    id: audit-report-location
    location:
      file: CodingRules.md
      line: 90
    summary: Fact-finder report artifact and blocking handling undefined
  - detail: "Item says 'Delete violations.txt if nothing else references it' but M1
      scenario 'Plant­ed-rule coverage preserved: checked against the planted
      rule list' needs that list as oracle. After deletion, oracle vanishes
