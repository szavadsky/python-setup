      ADR.
    disposition: fix
    id: u3-inside-story
    location:
      file: src/python_setup_lint/runner/_record_parsers.py
      line: 29
    summary: U3 determinism risk embedded in story with No-src-changes ban
  - detail: TD-1/semantic req5 requires extracting real suppressed codes at
      suppression_justification/bare-except call sites and regenerating
      tests/data/golden/... in the same change if heuristic outcomes shift
      (rule-echo now compares against real code, not 'unjustified-suppression').
      But epic Out-of-scope forbids tests/integration.py, tests/conftest.py and
