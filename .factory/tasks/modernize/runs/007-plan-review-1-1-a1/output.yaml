    disposition: fix
    id: assumptions-parallel-race
    location:
      file: pyproject.toml
      line: 48
    summary: Parallel creation of tests/assumptions risks conflicts/stale counts
  - detail: Plan defines reranker accept/reject as non-material to make 'preserve +
      replace' testable, keeping only heuristic gate outcomes as material. True
      for dev/CI without the extra (heuristic fallback), but consumers with
      sentence-transformers installed today get reranker decisions that will
      change. Spikes will measure accuracy and choose smallest meeting bar, but
      operator should be aware W9704 may tighten for extra users. No blocking
      change; informational record warranted.
    disposition: human-awareness
    id: material-boundary-impact
    location:
      file: src/python_setup_lint/checkers/_semantic.py
      line: 126
    summary: Non-material reranker boundary changes extra-user outcomes
  - detail: Moving from ~/.cache/python-setup/semantic/results.json (gitignored,
      per-machine, unbounded, truncated-SHA key incl. context) to committed
      .python-setup-decisions.json (sorted, readable, lock+merge, mark-and-sweep
      scoped to linted files) makes W9704 reproducible without the extra but
      adds a committed file to every consumer repo, reviewable diffs, small
      line-local merge conflicts, and install/setup doc updates. File must avoid
      high-entropy keys tripping detect-secrets. Architect can decide now;
      operator should be aware of consumer-repo impact.
    disposition: human-awareness
    id: git-cache-consumer-impact
    location:
      file: src/python_setup_lint/checkers/_semantic.py
      line: 38
    summary: Git-stored cache adds committed file to consumer repos
