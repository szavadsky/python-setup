      protocol or ownership exception defined; parallel start races M1 creation.
      Define owner/exception (epic PR touches golden with root review, or root
      performs regen) and ordering after M1.
    disposition: fix
    id: semantic-golden-ownership
    location:
      file: src/python_setup_lint/checkers/conformance/suppression_justification_checker.py
      line: 152
    summary: Semantic epic must regen golden it is forbidden to own
  - detail: "M3 interfaces define row shapes
      {module,section,evidence,category,LoC,owner,fix} but no artifact: item
      report only, or committed file (design/test-audit)? No path, no consumer
