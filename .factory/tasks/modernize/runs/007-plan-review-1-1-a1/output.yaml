status: changes_requested
summary: Bounds OK (3/8 milestones, 5/50 items, unique slugs, acyclic) but M1
  golden contract is unimplementable (nullable crash/R0801, missing
  package/rumdl, overwrite-rc clash, msg-loss) and M2/M3 have sizing, dependency
  and ownership gaps blocking iteration 2.
suggestions:
  - detail: "M1 interface pins Finding as
      {tool:str,file:str,line:int,col:int,rule:str} but runner emits None for
      file/line/col on crashes (__CRASH__), R0801 similar-lines spans and R0401
      cycles. _violation_sort_key explicitly handles None. Dropping those
      records loses crash detection; coercing to ''/-1 changes diff semantics.
      Specify nullable schema (file/line/col: str|None etc), POSIX
      relativization incl. R0801-embedded spans, multiset list-equality
      preserving duplicates, and custom diff ignoring msg (cannot reuse
      _compare_violation_lists which includes msg)."
    disposition: fix
    id: golden-schema-nullable
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 133
    summary: Golden schema forbids None but baseline uses None for crash/R0801/R0401
  - detail: Existing gate builds RunnerConfig(cwd=project,
      package_name='minimal_sample') plus a project-local rumdl.toml stripping
      the tests/data exclusion. M1 interface shows RunnerConfig(cwd,
      config_paths=shipped_config_paths()) with no package_name and no rumdl
      override. Without package_name, mypy.stubtest and pyright verify types
      print SKIPPED and emit zero records; with shipped rumdl exclude, sample
      AGENTS.md MD findings vanish. Golden would pin a different tool set than
      the gate. Include package_name and rumdl-override (or explicit
      shipped_config_paths+make_config contract) in M1 interfaces.
    disposition: fix
    id: golden-missing-package-rumdl
    location:
      file: tests/integration.py
      line: 100
    summary: M1 capture omits package_name and rumdl override, changing tool coverage
  - detail: _handle_baseline with overwrite_baseline=True always prints 'Baseline
      saved' and returns 0, masking violations. test_setup_new_and_lint asserts
      rc!=0 on the same run. Item says both 'Capture with
      run_lint(...,overwrite_baseline=True)' and 'Prefer extending the pipeline
      run already in test_setup_new_and_lint over adding a second full run' —
      unsatisfiable together. Specify either a second full run for capture, or
      direct _capture_baseline(results) without the baseline arg, preserving the
      rc!=0 assertion.
    disposition: fix
    id: golden-overwrite-rc-conflict
    location:
      file: src/python_setup_lint/runner/_cli_helpers.py
      line: 64
    summary: overwrite_baseline forces rc=0, clashes with rc!=0 single-run reuse
  - detail: Today brush-off is 'pre-existing in output' and carry-from is absence of
      '_carry_from_external+unjustified-suppression' on same line — both need
      msg/file context. Golden drops msg per ADR-001, leaving only
      {tool,file,line,col,rule}. Multiple unjustified-suppression rows become
      indistinguishable. Scenario 'checked against planted rule list ...
      pre-existing yields unjustified-suppression, carry-from yields none' is
      unfalsifiable without pinning which file:line corresponds to each fixture
      or retaining msg for those rows. Define file:line pins or a msg-preserving
      side assertion.
    disposition: fix
    id: golden-brushoff-msg-loss
    location:
      file: tests/integration.py
      line: 139
    summary: Brush-off/carry assertions unexpressible after msg dropped
  - detail: "Byte-identical regen needs pinned serialization: json.dump
      indent/sort_keys/ensure_ascii/trailing newline, POSIX relativization, None
      encoding, sort key (tool,file,line,col,rule) with None ordering matching
      _violation_sort_key, and multiset equality preserving duplicate tuples
      collapsed by msg removal. Also clarify fresh git copy per run vs same tmp
      dir (detect-secrets bootstrap vs --baseline hook mode differs on second
      run in same dir). Without this, 'run twice, byte-identical' and 'lists
      every added/removed' are not falsifiable."
    disposition: fix
    id: golden-dump-determinism
    location:
      file: src/python_setup_lint/runner/baseline.py
      line: 182
    summary: Golden JSON dump/sort/diff/normalization underspecified
  - detail: integration._init_git does git init + config test@test + git add . (no
      commit); runner._autofix_helpers._git_init does git init -q + config
      test@example.com with no add. Autofix conflict tests rely on
      staged-vs-unstaged states via _stage/_commit_all; switching them to
      add-all changes conflict semantics and risks false passes/failures. M2
      interface 'git_init(project:Path)->None' hides email/add/commit choices.
      Specify exact contract (init+config+add? commit?) and migration for each
      caller, with conflict-test preservation proof, not just 'golden unchanged,
      test counts same'.
    disposition: fix
    id: git-init-contract
    location:
      file: tests/runner/_autofix_helpers.py
      line: 24
    summary: Merged git_init changes add/email semantics, risks autofix tests
  - detail: Item says extract _make_config (package_name + rumdl.toml copy stripping
      tests/data) into tests/_project_helpers.py, but M2 directionalInterfaces
      list only copy_sample_project/git_init/shipped_config_paths. _make_config
      holds gate-critical behavior (package_name enables stubtest/verifytypes;
      rumdl override enables MD022/MD009/MD012/MD071). Missing contract means
      implementer may drop override. Add _make_config/project-config builder
      signature, ownership, and rumdl handling.
    disposition: fix
    id: make-config-missing
    location:
      file: tests/integration.py
      line: 83
    summary: M2 interfaces omit _make_config despite requiring extraction
  - detail: integration.py is 627 lines. Removable helpers total ~67 lines
      (_copy_sample/_init_git/_read_violation_rules/_shipped_config_paths/_make_config)
      plus ~20 lines substring loop if replaced by golden = ~90 lines -> ~537
      lines, still >500. Even with collect/assert helpers extracted, call sites
      remain. Scenario 'has <=500 lines and no suppression, test names
      unchanged' is unachievable by helper extraction alone; needs test-method
      moves/splits which change node IDs or require new modules. Re-scope (split
      file, move non-gate tests, or adjust limit with ADR) with line budget
      evidence.
    disposition: fix
    id: integration-500-unachievable
    location:
      file: tests/integration.py
      line: 12
    summary: M2 500-line target unachievable by helper extraction alone
  - detail: "test-debloat-audit must judge 'duplicate-of golden' and
      coding-rules-audit must propose ownership including new
      tests/_project_helpers.py, but neither audit lists deps on
      golden-findings-snapshot or consolidate-integration-helpers. Engine may
      run M3 in parallel with M1/M2, producing stale recommendations. Add deps:
      both audits after golden; test audit after consolidate (or after
      golden+assumptions for new counts). Without this, 'disjoint ownership
      excludes semantic files' cannot be validated."
    disposition: fix
    id: audit-missing-deps
    location:
      file: tests/integration.py
      line: 111
    summary: M3 audits lack deps on golden/consolidate, risk stale analysis
  - detail: U3 (pylint R0801 ordering, detect-secrets git ls-files, pyright/mypy
      churn, absolute leakage) is run-twice-and-normalize work with possible
