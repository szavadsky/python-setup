    description: "Report-only, zero repo writes (no committed corpus in I5; poc
      consumes report tables). Collect N real repo suppressions + threshold
      115-row table + brush-off/meaningful tables, DEDUPED by normalized
      justification (strip+collapse ws, keep case; target N>=100 post-dedup),
