  - slug: model-eval-poc
    kind: poc
    title: CPU accuracy/latency evaluation (veto-only)
    description: "Prototype on tmp/venv only; zero committed files; network inside
      spike only. Consumes matrix + corpus reports (never invents
      candidates/labels). Mapping: justification=primary=(comment or
      text).strip(), rule=joined codes (current symbol where unavailable,
      recorded), context=code_context (None allowed); decision=prob>=threshold;
      VETO-ONLY final=heuristic AND (prob>=threshold) per ADR-014 (replace mode
      rejected — do not score). Smallest=lexicographic (params, weights bytes,
      CPU RSS, p50 latency). Score ALL matrix candidates at 0.5/0.6/0.7 (or
      explicit exclusion with reason): accuracy, meaningless-precision,
      meaningful-recall on heuristic-accepted stratum (overall also reported),
      CPU cold-load + warm p50/p95 + peak RSS, determinism check
      (GLIDE_MAX_BATCH=1 when caching; batching must not shift scores). Bars
      90/95/85 apply to accepted stratum. Recommend smallest compliant
      model+prompt+threshold or no-go with evidence (license/CPU/accuracy
      blockers separated). On any Fastino/unclear recommendation file a steer
      question for human approval; always flag the independent second-rater
      requirement. Feeds runtime-pinning + M4 branch."
