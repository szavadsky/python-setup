adrs:
  - id: ADR-019
    title: Tracked-cache keying, file identity, and refresh contract (I5)
    context: ADR-010 freezes backend + tracked-cache contracts but leaves
      file-identity vs path-free API, key composition, score vs verdict, refresh
      shape, CI direction, isolation scope, sort key, prune policy, --path
      scoping, jobs>1 behavior unspecified (I5 pack Q3). semantic_check is
      deliberately path-free (test_pylint_cache_semantics.py:171-181) and
      callers pass no paths; memo key includes code_context + 64-bit truncation;
      no CLI surface exists; secrets baseline enables HexHighEntropyString;
      writer-first verdict pins jobs=1 sequential. I4 ADR-017/018 planned
      lint-flag refresh + decisions-module placement but never merged (files
      missing at HEAD). I4 left a prune-only producer gap (awareness).
    decision: "Re-affirm ADR-017/018 shape with I5 resolutions: (1) semantic_check
      stays path-free; file identity supplied at checker layer via a
      refresh-only sidecar producer (suppression/bare-except emit branch when
      PYTHON_SETUP_LINT_DECISIONS_OBSERVE=1, observations {file via
      node.root().file, justification, rule, model, score} appended to
      PYTHON_SETUP_LINT_DECISIONS_OBSERVE_PATH tmp *.jsonl, never committed;
      normal lint emits nothing; zero _base/_semantic/_decision_backend diff).
      (2) Tracked key is (justification normalized [strip+collapse ws, keep
      case], rule joined codes, model '<id> rev <short12> prompt-vN'); context
      is model input only, NOT in key. (3) Store score float [0,1] + decision
      bool (re-thresholdable; protocol range enforced by loader clamp + test).
      (4) Refresh is lint --refresh-decisions [--path ...] (setup-subcommand
      rejected); FAILS under CI/GITHUB_ACTIONS (golden-guard shape);
      DECISIONS_PATH test-only under PYTEST_CURRENT_TEST only; production root
      config.cwd with traversal guard; array sorted (rule, justification,
      model), indent=2 sort_keys; files sorted unique POSIX, union-merged; prune
      automatic missing/stale (no --prune flag); --path retains unscanned;
      jobs_from_rcfile() reads effective jobs from resolved pylint rcfiles and
      any >1 fails loudly naming file (no sidecars). (5) Placement
      python_setup_lint/decisions/_decision_cache.py + .pyi; tach exact TOML:
      [[modules]] decisions depends_on=[], checkers/runner
      depends_on=[python_setup_lint.decisions]; cache-impl sole tach.toml owner.
      (6) last-seen is ISO date updated ONLY when score/decision/files change
      (identical refresh preserves bytes; double-run byte-identical holds). (7)
      Read-only = SHA-256 of cache file bytes (missing=sentinel) unchanged
      across ordinary run_lint. (8) No .gitignore change (root file committed),
      no hatch entry, no bare hex>=20."
    consequences: Single refresh contract for M1 format assumptions + M3 behavioral
      impl; storage + producer atomic in one item (checker->sidecar->cache
      proven on tmp, no prune-only gap); normal lint read-only provable by hash;
      deterministic serialization provable by sort key + last-seen rule; secrets
      + tach scans clean; M3 tests assert all branches on tmp.
  - id: ADR-020
    title: Model gating and default-off wiring for I5
    context: Intent names GLiDE-0.4B or smaller; GLiDE is 0.4B/0.81GB
      bf16/CUDA-tested/torch 2.14/transformers 5.17/glide-vendored/Fastino
      Community License (commercial revenue gate + attribution + copyleft
      derivatives) vs MIT project; smallest-in-family so 'or smaller' needs a
      different family; ADR-009 corpus gate untouched (215/0 single-author, no
      corpus artifacts, no CPU bench); get_backend has no production path
      (DECISION_MODEL warn-only, PROMPT_VERSION dead); veto semantics mean
      default-on tightens W9704/W9738 for every consumer installing the extra.
    decision: "Gate wiring on U1 verdict with allowlist (Apache-2.0/MIT/BSD allowed;
      CC-BY-NC excluded; Fastino/unclear flagged for human review; no ship
      without license verdict) + CPU bench (cold-load/warm p50/p95 + RSS on
      target class, GLIDE_MAX_BATCH=1 determinism when caching) + corpus pilot
      (N>=100 post-dedup, both strata, rubric + two-pass blinded + adjudication
      + agreement) + RECORDED HUMAN APPROVALS (license/Fastino decision +
      independent second-rater corpus sign-off, steer answer IDs cited in the
      wiring report; eval-poc files the license steer question). Veto-only
      evaluation at 0.5/0.6/0.7; bars 90/95/85 on heuristic-accepted stratum;
      smallest compliant or no-go. Wiring (on go + approvals only): [semantic]
      gains pinned runtime (CPU wheels, base stays light), loader via
      DECISION_MODEL with PROMPT_VERSION folded, failure maps to None maps to
      heuristic with exactly-one warning (no retry storm), no_try_import +
      emptiness pins updated deliberately, uv.lock regenerated. Default
      heuristic-only until M4 go merges; semantic-on pinned by M4 fake-backend
      integration regardless. On no-go/blocked/missing-approval: zero prod
      writes, no-op attestation, heuristic-only docs."
    consequences: No silent swap and no self-approved license/corpus gate; gates
      stay offline/fast/deterministic; packaging change only on compliant +
      approved verdict; close-up must not claim swap complete on no-go; I6
      triggers explicit (independent rater, Fastino decision, CPU bench).
  - id: ADR-021
    title: Semantic-on behavior pinning
    context: Golden + integration capture with SEMANTIC=0
      (tests/integration.py:110-115; tests/_golden.py:54), so model-enabled
      W9704/W9738 outcomes unpinned; a model could pass the suite while changing
      consumer behavior; veto extremes (Fake 1.0 preserves, 0.0 vetoes)
      deterministic without network; but pylint runs in a subprocess, so
      parent-process backend call-counts are unobservable across run_lint.
    decision: "Pin veto path in two layers: (1) IN-PROCESS via _walk_and_release +
      _RecordingBackend (same process, call-counts observable): 1.0 preserves
      heuristic accepts, 0.0 vetoes them, brush-off never reaches backend (count
      0), one call per unique pair (memo hit); (2) SUBPROCESS via sample-project
      run asserting verdict deltas only (W9704 present/absent flips as
      predicted; cache-hit without model emits persisted verdict), never
      call-counts; plus exactly one slow+with_real_api e2e SKELETON (skipped 'no
      model wired' until go; on go wired with importorskip + CPU budgets).
      Golden stays SEMANTIC=0 (heuristic contract); semantic-on contract lives
      in new tests, not the golden file."
    consequences: Veto tightening visible before any model ships with no
      unobservable asserts; no golden churn for semantic-on; real-model coverage
      gated behind slow + importorskip; M4 wiring asserts no SEMANTIC=0 drift.
  - id: ADR-022
    title: Test-harness single-sourcing and debloat acceptance
    context: Measured duplication at HEAD (13 _make_tc, 10 _walk_and_release, 8
      _msg_ids with open()/module_name variance; 3 _RecordingBackend; 2
      _UvCallRecorder; 2 extra_block; 2 _semantic_disabled; dead helpers;
      vestigial raising=False cache tests; smoke overlapping integration + fake
      orchestration) vs behavior contracts (115-row heuristic table, W9704/W9738
      checker tests, golden 158). 'Never test linting' defined only by 644774e
      prune precedent. No line-reduction metric beyond C0302/R0912/R0915 + empty
      baseline.
    decision: Single-source harness helpers with variance-preserving options
      (testing.py open_checker/module_name with backward-compat defaults; one
      home per double/fixture with reported placement + import graph); delete
      dead helpers only with grep-zero no-call-site proof; rewrite (not loosen)
      vestigial cache tests to live hash/tmp contracts; smoke kept-narrowed
      (non-overlapping asserts with per-assert survivor analysis) or deleted
      with removal-to-survivor map to integration + fake orchestration; 115-row
