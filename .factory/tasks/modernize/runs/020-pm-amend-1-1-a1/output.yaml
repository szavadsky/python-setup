      no-op if shipped rumdl missing, OSError propagates),
      build_pylint_overlay_config(project,disable_rule)->Path,
      ensure_precommit_or_skip()->None,
      install_twice_assert_idempotent(project,monkeypatch)->None. (2) Delete
      duplicate defs in tests/conftest.py and tests/runner/_autofix_helpers.py
      (import instead); per-consumer imports ONLY:
      integration->{copy,git_init_and_stage,make_runner_config,build_overlay,en\
      sure_precommit,install_twice}; conftest->{shipped_config_paths};
      _autofix->{git_init_bare,stage_file,commit_all}; test_self_lint_clean +
      autofix tests switch imports. (3) Trim tests/integration.py per budget
      (remove >=127, target <=490, hard <=500, no suppression): helpers ~58 +
