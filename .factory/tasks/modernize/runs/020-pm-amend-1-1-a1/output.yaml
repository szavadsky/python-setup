  - assignment: "Create tests/assumptions/__init__.py + 3 modules
      (test_astroid_contracts.py, test_pylint_contracts.py,
      test_beartype_contracts.py) with distinct classes
      TestAstroidContracts/TestPylintContracts/TestBeartypeContracts, pytestmark
      no_external_api, tests named test_<api>_given_<condition>_then_<expected>
      asserting OBSERVED behavior at pinned versions. astroid:
      Module.stream().read() bytes|str-tolerant (product decodes-if-bytes);
      doc_node Const/JoinedStr when docstring present else None for
      module/class/function; nodes_of_class(tuple) returns union in document
      order; Const/JoinedStr expose int
      fromlineno/end_lineno/col_offset/end_col_offset (assert on sample
      literal). pylint (third-party side): PyLinter.register_checker lifecycle
      incl open()/close() order (record observed);
      CheckerTestCase/UnittestLinter capture into release_messages (assert
      observed MessageTest shape); MessageDefinitionTuple leading fields
      (msgid,symbol,description) + record full arity. beartype: decorate fn with
      TYPE_CHECKING-only forward-ref, assert OBSERVED outcome (call-time vs
      import-time vs checker-only), record in item report for M3. No src/
      changes. Must NOT touch AGENTS.md (consolidate is sole counts owner).
      Acceptance: `uv run pytest tests/assumptions -q` all pass, one test per
      contract."
