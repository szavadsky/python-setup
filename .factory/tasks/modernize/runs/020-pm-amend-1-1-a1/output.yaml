  - assignment: "Using tests/_golden.py from golden-helpers-unit and the probe
      verdict (SUFFICIENT — test-side normalization sufficient, bounded src
      allowance CLOSED). (1) Commit
      tests/data/golden/minimal_sample_project_findings.json (sorted Finding
      array) + ..._tool_counts.json ({tool:min_count}) via helper serialize
      (indent=2/sort_keys+newline), outside sample dir, never copied/linted;
      violations.txt RETAINED as oracle. (2) Edit tests/integration.py
      test_setup_new_and_lint ONLY: keep first run (no baseline, rc!=0) AND
      retain tool-section/SKIPPED/[CRASH]/W9705 assertions; add dedicated second
      capture (caller owns tmp dir, copy_sample, git-init, _make_config incl
      rumdl override, monkeypatched PYTHON_SETUP_LINT_SEMANTIC=0) calling
      collect_findings; replace planted-rule substring loop with golden equality
      + oracle/tool coverage; brush-off/carry as tool-qualified lookups
      (tool='pylint', file='src/minimal_sample/mod.py', line 49 present / line
      56 absent); drift injection on in-memory list copies only (drop one,
      append synthetic, assert exact sorted added/removed; committed golden
      untouched). Guards: temp copies ONLY — never bare `uv run lint` on repo
      (ruff-format write hazard); never touch .factory records; do not touch
      src/ (if wiring discovers contrary evidence, stop and report — bounded
      allowance baseline relativize/sort + parser ordering <=40 lines
      determinism-only with reviewed diff applies ONLY with proof, and dropping
      any oracle rule without ADR is forbidden). Acceptance (baseline-relative):
      `uv run pytest tests/integration.py -v` and `uv run pytest
      tests/test_golden.py -q` pass; 6 pre-existing 13-vs-14 failures persist
      with no new failures; regen (UPDATE=1, no CI) twice byte-identical for
      both files; golden holds zero __CRASH__; empty lint.baseline."
