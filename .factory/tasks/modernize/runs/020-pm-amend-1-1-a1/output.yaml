  - assignment: "Create tests/_golden.py as SOLE golden owner (no pipeline run in
      this item; kind concretized from outline story to test-only per contract —
      tests-only, no src/, no golden files yet). Read golden-determinism-probe
      report first; implement its normalization spec (verdict SUFFICIENT).
      Module API: UPDATE_ENV=PYTHON_SETUP_LINT_UPDATE_GOLDEN,
      SEMANTIC_ENV=PYTHON_SETUP_LINT_SEMANTIC; Finding TypedDict
      {tool,file|None,line|None,col|None,rule}; finding_key(f) None-safe
      (tool,file or '',line if int else -1,col if int else -1,rule) mirroring
      baseline._violation_sort_key; normalize_record (drop msg, relativize vs
      project, strip ./, backslash->/, as_posix, assert non-absolute); serialize
      via json.dump(indent=2,sort_keys=True)+trailing newline;
      collect_findings(config,capture_path)->list[Finding] (run_lint
      baseline=capture_path/overwrite, read JSON, normalize each, sort by key,
      assert len!=0) defined but NOT invoked here; assert_matches_golden
      (Counter multiset diff on keys, sorted added/removed; UPDATE=1:
      pytest.fail('refusing to rewrite golden under CI...') if CI/GITHUB_ACTIONS
      set else warn+rewrite golden+counts together); read_oracle_rules,
      slice_tool_section, assert_oracle_coverage, assert_tool_coverage. Add
      tests/test_golden.py synthetic Finding lists ONLY (no run_lint, no
      pipeline, no tmp copies): key None vs str/int ordering, POSIX
      normalization (./ strip, backslash, absolute assert), multiset diff exact
      sorted added/removed, CI-guard fail vs warn+rewrite, coverage asserts,
      serialization byte-format (indent/sort/newline, no msg/timestamps).
      Guards: no src/ changes, no tests/data writes, no integration edits, never
      touch .factory records. Acceptance: `uv run pytest tests/test_golden.py
      -q` passes; tests/_golden.py <=500 lines, formatted."
    citations:
